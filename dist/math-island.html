  <script>/* js/widgets/drag.js */
/* 数学岛 · 拖拽小工具（Pointer Events，触屏和鼠标都能用）
 * MI.drag.attach(源元素, {
 *   ghost: () => 跟手移动的元素,
 *   target: '.可放下的元素选择器',
 *   onDrop: (目标元素) => {},
 *   onTap: () => {}            // 没怎么移动就松手，当作点击
 * }) */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};

  function attach(src, opts) {
    var startX = 0, startY = 0, dragging = false, ghost = null, pid = null, lastOver = null;

    function move(e) {
      if (e.pointerId !== pid) return;
      var dx = e.clientX - startX, dy = e.clientY - startY;
      if (!dragging && Math.abs(dx) + Math.abs(dy) > 8) {
        dragging = true;
        ghost = opts.ghost ? opts.ghost() : src.cloneNode(true);
        ghost.classList.add('drag-ghost');
        document.body.appendChild(ghost);
        src.classList.add('dragging');
      }
      if (dragging) {
        e.preventDefault();
        ghost.style.transform = 'translate(' + (e.clientX - 28) + 'px,' + (e.clientY - 34) + 'px)';
        var over = hit(e);
        if (over !== lastOver) {
          if (lastOver) lastOver.classList.remove('drop-over');
          if (over) over.classList.add('drop-over');
          lastOver = over;
        }
      }
    }
    function hit(e) {
      if (ghost) ghost.style.display = 'none';
      var el = document.elementFromPoint(e.clientX, e.clientY);
      if (ghost) ghost.style.display = '';
      return el && el.closest ? el.closest(opts.target) : null;
    }
    function up(e) {
      if (e.pointerId !== pid) return;
      cleanup();
      if (dragging) {
        var t = hit(e);
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
        src.classList.remove('dragging');
        if (lastOver) lastOver.classList.remove('drop-over');
        if (t && opts.onDrop) opts.onDrop(t);
      } else if (e.type === 'pointerup' && opts.onTap) {
        opts.onTap();
      }
      dragging = false; ghost = null; lastOver = null; pid = null;
    }
    function cleanup() {
      document.removeEventListener('pointermove', move);
      document.removeEventListener('pointerup', up);
      document.removeEventListener('pointercancel', up);

    // 键盘回车/空格触发的 click（detail 为 0）也当作点击
    src.addEventListener('click', function (e) { if (e.detail === 0 && opts.onTap) opts.onTap(); });
  }

  MI.drag = { attach: attach };

/* 数学岛 · 数位顺序表：把数字卡拖进数位格组成数（也可以先点卡片再点格子）

            else if (vals[p] !== '') { vals[p] = ''; render(); ctx.changed(); }

    }

    var cards = h('div', { class: 'pv-cards' });

      (function (d) {
        var c = h('button', { type: 'button', class: 'pv-card', text: String(d), 'aria-label': '数字卡 ' + d });

      },
      reveal: function () {

    var lookIdx = s.length - 1 - look;
    var unitIdx = s.length - 1 - (unit === '亿' ? 8 : 4);
    var row = digitRow(s);
    var step = 1, fill = null, locked = false;
    var tip = h('p', { class: 'widget-tip round-tip', text: '第 1 步：点一点，要看哪一位上的数？' });
    var fillBox = h('div', { class: 'round-fill' });
    var btns = s.split('').map(function (c, i) {
      var b = h('button', {
        type: 'button', class: 'dg dg-btn', text: c, 'aria-label': N.PLACE_NAMES[s.length - 1 - i] + '：' + c,
        onclick: function () { if (!locked && step === 1) pick(i, b); }
      });
      row.appendChild(b);
      if (i === unitIdx) b.classList.add('unit-place');
      return b;
    });
    function pick(i, b) {
      if (i === lookIdx) {
        MI.sound.play('correct');
        markLook();
        goStep2();
      } else {
        MI.sound.play('wrong');
        b.classList.add('shake');
        setTimeout(function () { b.classList.remove('shake'); }, 300);
        tip.textContent = '这是' + N.PLACE_NAMES[s.length - 1 - i] + '。' + q.hint;
        tip.classList.add('warn');

    function markLook() {
      btns.forEach(function (x, i) {
        x.disabled = true;

      incomplete: function () { return step === 1 ? '先点出要看哪一位哦' : '先填上答案哦'; },
      onWrong: function (v) { if (fill) fill.onWrong(v); },
      reveal: function () { if (step === 1) { markLook(); goStep2(); } fill.reveal(); },
      lock: function () { locked = true; if (fill) fill.lock(); btns.forEach(function (b) { b.disabled = true; }); },
      destroy: function () { if (fill) fill.destroy(); }
    };
  };

  // ---------------- 算盘 ----------------
  MI.types.abacus = function (box, q, ctx) {
    var h = MI.ui.h, svg = MI.ui.svg, N = MI.num;
    var s = q.data.digits, n = s.length;
    var W = 300, H = 200, pad = 38, rodGap = (W - pad * 2) / (n - 1 || 1), beamY = 70;
    var el = svg('svg', { viewBox: '0 0 ' + W + ' ' + H, class: 'abacus', role: 'img', 'aria-label': '算盘' });
    el.appendChild(svg('rect', { x: 4, y: 4, width: W - 8, height: H - 8, rx: 12, class: 'ab-frame' }));
    for (var i = 0; i < n; i++) {
      var x = pad + i * rodGap;
      el.appendChild(svg('line', { x1: x, y1: 12, x2: x, y2: H - 12, class: 'ab-rod' }));
    }
    el.appendChild(svg('rect', { x: 8, y: beamY - 4, width: W - 16, height: 8, class: 'ab-beam' }));

  <script>/* js/widgets/vertical-mul.js */
/* 数学岛 · 竖式乘法网格：逐格填写部分积和最终积，有进位小格；“检查这一步”只高亮错的那一格并给提示
 * 题目 data：{ a, b }；答案：每一行的字符串（MI.mul.rowString），由 MI.mul.layout 计算 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  MI.types = MI.types || {};

  var STEP_TEXT = {
    p1: function (row, L) { return '用第二个因数个位上的 ' + row.m + ' 去乘 ' + L.coreA + '。'; },
    p2: function (row, L) { return '用十位上的 ' + row.m + ' 去乘 ' + L.coreA + '，末位和十位对齐。'; },
    sum: function (row, L) { return '把两次乘得的积加起来' + (L.z ? '，再在末尾添 ' + L.z + ' 个 0' : '') + '。'; },
    final: function (row, L) { return '用 ' + row.m + ' 去乘 ' + L.coreA + (L.z ? '，再在末尾添 ' + L.z + ' 个 0' : '') + '。'; }
  };

  MI.types.vmul = function (box, q, ctx) {
    var h = MI.ui.h;
    var L = MI.mul.layout(q.data.a, q.data.b);
    var W = L.width, R = L.rows.length;
    var vals = [], carries = [], cells = [], carryCells = [], rowEls = [];
    var act = { r: 0, c: L.rows[0].start, carry: false };
    var stepR = 0, locked = false;

    var grid = h('div', { class: 'vm', style: { '--w': W } });
    function staticRow(text, end, sign) {
      var row = h('div', { class: 'vm-row vm-static' });
      for (var c = W - 1; c >= 0; c--) {
        var k = c - end, ch = k >= 0 && k < text.length ? text[text.length - 1 - k] : '';
        if (sign && c === end + text.length) ch = '×';
        row.appendChild(h('span', { class: 'vm-fixed' + (ch === '×' ? ' vm-sign' : ''), text: ch }));
      }
      return row;
    }
    grid.appendChild(staticRow(L.top.text, L.top.end));
    grid.appendChild(staticRow(L.bottom.text, L.bottom.end, true));
    grid.appendChild(h('div', { class: 'vm-line' }));
    L.rows.forEach(function (row, r) {
      if (row.kind === 'sum') grid.appendChild(h('div', { class: 'vm-line' }));
      vals.push([]); carries.push([]); cells.push([]); carryCells.push([]);
      var cr = h('div', { class: 'vm-row vm-carry-row' });
      var dr = h('div', { class: 'vm-row vm-input-row' });
      for (var c = W - 1; c >= 0; c--) {
        vals[r][c] = ''; carries[r][c] = '';
        (function (r, c) {
          var cc = h('button', { type: 'button', class: 'vm-carry', 'aria-label': '进位小格', onclick: function () { focus(r, c, true); } });
          var dc = h('button', { type: 'button', class: 'vm-cell', 'aria-label': '第 ' + (r + 1) + ' 行，从右数第 ' + (c + 1) + ' 格', onclick: function () { focus(r, c, false); } });
          carryCells[r][c] = cc; cells[r][c] = dc;
          cr.appendChild(cc); dr.appendChild(dc);
        })(r, c);
      }
      grid.appendChild(cr);
      grid.appendChild(dr);
      rowEls.push(dr);
    });

    var tip = h('p', { class: 'widget-tip vm-tip' });
    var checkBtn = h('button', { type: 'button', class: 'btn btn-small vm-check', text: '✔ 检查这一步', onclick: checkStep });
    // 提示和“检查这一步”放在竖式上面，不会被键盘挡住
    box.appendChild(h('div', { class: 'vm-tools' }, [tip, checkBtn]));
    box.appendChild(h('div', { class: 'vm-wrap' }, grid));
    box.appendChild(h('p', { class: 'widget-tip', text: '点格子再按数字，写完自动往左移。每格上面的小格可以记进位（不算分）。' }));

    function setTip(text, warn) { tip.textContent = text; tip.classList.toggle('warn', !!warn); }
    function stepTip() {
      if (stepR >= R) { setTip('都写好了，按“确定”交卷吧！'); return; }
      var row = L.rows[stepR];
      setTip('第 ' + (stepR + 1) + ' 步：' + STEP_TEXT[row.kind](row, L));
    }

    function render() {
      for (var r = 0; r < R; r++) for (var c = 0; c < W; c++) {
        var d = cells[r][c], k = carryCells[r][c];
        d.textContent = vals[r][c]; k.textContent = carries[r][c];
        d.classList.toggle('active', !locked && act.r === r && act.c === c && !act.carry);
        k.classList.toggle('active', !locked && act.r === r && act.c === c && act.carry);
      }
    }
    function focus(r, c, carry) {
      if (locked) return;
      act = { r: r, c: c, carry: !!carry };
      render();
    }
    /** 当前这一行被键盘挡住时，往上滚一点 */
    function reveal(r) {
      var kp = document.getElementById('keypad');
      if (!kp || kp.hidden) return;
      var over = rowEls[r].getBoundingClientRect().bottom - kp.getBoundingClientRect().top + 12;
      if (over > 0) { try { root.scrollBy({ top: over, behavior: MI.ui.reducedMotion() ? 'auto' : 'smooth' }); } catch (e) { root.scrollBy(0, over); } }
    }
    function clearMarks(r) {
      for (var c = 0; c < W; c++) cells[r][c].classList.remove('wrong');
    }
    function onKey(k) {
      if (locked) return;
      var r = act.r, c = act.c;
      clearMarks(r);
      if (k === 'ok') { ctx.submit(); return; }
      if (k === 'clear') { for (var i = 0; i < W; i++) { vals[r][i] = ''; carries[r][i] = ''; } act.c = L.rows[r].start; act.carry = false; render(); return; }
      if (k === '⌫') {
        if (act.carry) carries[r][c] = '';
        else if (vals[r][c] !== '') vals[r][c] = '';
        else if (c > 0) { act.c = c - 1; vals[r][c - 1] = ''; }
        render(); return;
      }
      if (!/^\d$/.test(k)) return;
      if (act.carry) { carries[r][c] = k; act.carry = false; }
      else {
        vals[r][c] = k;
        if (c + 1 < W) act.c = c + 1;
        reveal(r);
      }
      rowEls[r].classList.remove('ok');
      render();
    }

    function expected(r, c) { return L.rows[r].cols[c]; }
    function firstWrong(r) {
      for (var c = 0; c < W; c++) if (vals[r][c] !== expected(r, c)) return c;
      return -1;
    }
    function rowEmpty(r) { for (var c = 0; c < W; c++) if (vals[r][c] !== '') return false; return true; }

    function checkStep() {
      if (locked) return;
      var r = act.r;
      if (rowEmpty(r)) { MI.ui.toast('先把这一行写上吧'); return; }
      var c = firstWrong(r);
      if (c >= 0) {
        MI.sound.play('wrong');
        cells[r][c].classList.add('wrong');
        setTip('这一格再看看：' + MI.mul.cellHint(L, r, c), true);
        act = { r: r, c: c, carry: false };
        render();
        return;
      }
      MI.sound.play('correct');
      rowEls[r].classList.add('ok');
      if (r + 1 < R) {
        stepR = Math.max(stepR, r + 1);
        act = { r: r + 1, c: L.rows[r + 1].start, carry: false };
        stepTip();
        tip.textContent = '这一步全对！' + tip.textContent;
        setTimeout(function () { reveal(r + 1); }, 30);
      } else { stepR = R; setTip('全部写对了，按“确定”交卷吧！'); }
      render();
    }

    MI.keypad.open({ extras: [], onKey: onKey });
    stepTip();
    render();
    setTimeout(function () { reveal(0); }, 50);

    function value() {
      for (var r = 0; r < R; r++) if (rowEmpty(r)) return null;
      return vals.map(function (row) { return MI.mul.rowString(row); });
    }
    return {
      value: value,
      incomplete: function () { return '每一行都要写哦'; },
      hintFor: function () {
        for (var r = 0; r < R; r++) { var c = firstWrong(r); if (c >= 0) return '第 ' + (r + 1) + ' 行有一格不对：' + MI.mul.cellHint(L, r, c); }
        return null;
      },
      onWrong: function () {
        for (var r = 0; r < R; r++) { var c = firstWrong(r); if (c >= 0) { cells[r][c].classList.add('wrong'); act = { r: r, c: c, carry: false }; render(); return; } }
      },
      reveal: function () {
        for (var r = 0; r < R; r++) { for (var c = 0; c < W; c++) { vals[r][c] = expected(r, c); cells[r][c].classList.remove('wrong'); } rowEls[r].classList.add('ok'); }
        locked = true; render(); setTip('');
      },
      lock: function () { locked = true; render(); checkBtn.disabled = true; MI.keypad.close(); },
      destroy: function () { MI.keypad.close(); },
      usesKeypad: true
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>/* js/widgets/diagrams.js */
/* 数学岛 · 线段图、时间轴、对比表（SVG 现场画）
 * data.diagram 的几种 kind：
 *   parts   { parts:[{value, label}], total:'一共 ? 人' }                   总量 = 部分 + 部分
 *   compare { bars:[{name, value, label}], diff:'少 380 本', total:'一共 ? 本' } 比多比少
 *   repeat  { count, unit:'128 元', countText:'15 个', total:'? 元' }      几个几（乘法）
 *   timeline{ start:分钟数, end:分钟数, startText, endText, label }        开始/结束时刻 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  var W = 340;

  function svg(tag, a) { return MI.ui.svg(tag, a); }
  function text(x, y, s, cls, anchor) {
    var t = svg('text', { x: x, y: y, class: 'dg-text ' + (cls || ''), 'text-anchor': anchor || 'middle' });
    t.textContent = s;
    return t;
  }
  /** 大括号：from x1 到 x2，开口朝 dir（'up' 表示括号在线段上方、尖朝上） */
  function brace(x1, x2, y, dir) {
    var s = dir === 'up' ? -1 : 1, m = (x1 + x2) / 2, d = 7 * s;
    var p = 'M' + x1 + ' ' + y + ' q0 ' + d + ' 7 ' + d + ' L' + (m - 7) + ' ' + (y + d) + ' q7 0 7 ' + d +
      ' q0 ' + (-d) + ' 7 ' + (-d) + ' L' + (x2 - 7) + ' ' + (y + d) + ' q7 0 7 ' + (-d);
    return svg('path', { d: p, class: 'dg-brace' });
  }
  function seg(x1, x2, y, cls) {
    var g = svg('g', { class: 'dg-seg ' + (cls || '') });
    g.appendChild(svg('line', { x1: x1, y1: y, x2: x2, y2: y }));
    g.appendChild(svg('line', { x1: x1, y1: y - 7, x2: x1, y2: y + 7 }));
    g.appendChild(svg('line', { x1: x2, y1: y - 7, x2: x2, y2: y + 7 }));
    return g;
  }
  function wrap(el, h, label) {
    el.setAttribute('viewBox', '0 0 ' + W + ' ' + h);
    el.setAttribute('class', 'diagram');
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', label || '线段图');
    return MI.ui.h('div', { class: 'diagram-wrap' }, el);
  }

  var kinds = {
    parts: function (d) {
      var el = svg('svg', {}), x0 = 20, x1 = W - 20, y = 62;
      var total = d.parts.reduce(function (s, p) { return s + p.value; }, 0);
      var x = x0;
      d.parts.forEach(function (p, i) {
        var w = (x1 - x0) * p.value / total;
        el.appendChild(seg(x, x + w, y, 'c' + i));
        el.appendChild(text(x + w / 2, y + 30, p.label));
        x += w;
      });
      el.appendChild(brace(x0, x1, y - 12, 'up'));
      el.appendChild(text((x0 + x1) / 2, y - 26, d.total, 'dg-ask'));
      return wrap(el, 104, '线段图：' + d.total);
    },
    compare: function (d) {
      var el = svg('svg', {}), x0 = 70, xr = d.total ? W - 70 : W - 16;
      var max = Math.max.apply(null, d.bars.map(function (b) { return b.value; }));
      var ys = [34, 84];
      d.bars.forEach(function (b, i) {
        var w = (xr - x0) * Math.max(0.25, b.value / max);
        el.appendChild(text(x0 - 10, ys[i] + 6, b.name, 'dg-name', 'end'));
        el.appendChild(seg(x0, x0 + w, ys[i], 'c' + i));
        el.appendChild(text(x0 + w / 2, ys[i] - 12, b.label));

      });
      if (d.diff) {
        var a = d.bars[0]._end, b2 = d.bars[1]._end, lo = Math.min(a, b2), hi = Math.max(a, b2);
        el.appendChild(svg('line', { x1: lo, y1: ys[1] - 22, x2: lo, y2: ys[1] + 8, class: 'dg-dash' }));
        el.appendChild(svg('line', { x1: lo, y1: ys[1], x2: hi, y2: ys[1], class: 'dg-dash' }));
        el.appendChild(brace(lo, hi, ys[1] + 10, 'down'));
        el.appendChild(text((lo + hi) / 2, ys[1] + 36, d.diff, 'dg-ask'));
      }
      if (d.total) {
        var xb = Math.max(d.bars[0]._end, d.bars[1]._end) + 8;
        el.appendChild(svg('path', { d: 'M' + xb + ' ' + (ys[0] - 8) + ' q8 0 8 8 L' + (xb + 8) + ' ' + ((ys[0] + ys[1]) / 2 - 6) + ' q0 6 8 6 q-8 0 -8 6 L' + (xb + 8) + ' ' + (ys[1]) + ' q0 8 -8 8', class: 'dg-brace' }));
        el.appendChild(text(xb + 18, (ys[0] + ys[1]) / 2 + 6, d.total, 'dg-ask', 'start'));
      }
      return wrap(el, d.diff ? 132 : 108, '线段图');
    },
    repeat: function (d) {
      var el = svg('svg', {}), x0 = 20, x1 = W - 20, y = 62;
      var n = d.count, show = n <= 8 ? n : 7;
      var w = (x1 - x0) / show;
      for (var i = 0; i < show; i++) {
        var gap = n > 8 && i === show - 2;
        el.appendChild(seg(x0 + i * w, x0 + (i + 1) * w, y, gap ? 'dg-gap' : ''));
        if (gap) el.appendChild(text(x0 + (i + 0.5) * w, y + 6, '……', 'dg-dots'));
      }
      el.appendChild(text(x0 + w / 2, y - 14, d.unit));
      el.appendChild(brace(x0, x1, y + 12, 'down'));
      el.appendChild(text((x0 + x1) / 2, y + 40, d.countText));
      el.appendChild(text(W / 2, 18, d.total, 'dg-ask'));
      el.appendChild(svg('line', { x1: x0, y1: 26, x2: x1, y2: 26, class: 'dg-dash' }));
      return wrap(el, 112, '线段图');
    },
    timeline: function (d) {
      var el = svg('svg', {}), x0 = 30, x1 = W - 30, y = 56;
      var h0 = Math.floor(d.start / 60), h1 = Math.ceil(d.end / 60);
      var span = Math.max(1, h1 - h0);
      function X(min) { return x0 + (x1 - x0) * (min - h0 * 60) / (span * 60); }
      el.appendChild(svg('line', { x1: x0 - 10, y1: y, x2: x1 + 10, y2: y, class: 'dg-axis' }));
      for (var hh = h0; hh <= h1; hh++) {
        el.appendChild(svg('line', { x1: X(hh * 60), y1: y - 6, x2: X(hh * 60), y2: y + 6, class: 'dg-axis' }));
        if (span <= 12 || hh % 2 === 0) el.appendChild(text(X(hh * 60), y + 24, hh + '时', 'dg-small'));
      }
      [[d.start, d.startText, '出发'], [d.end, d.endText, '到达']].forEach(function (p) {
        el.appendChild(svg('circle', { cx: X(p[0]), cy: y, r: 7, class: 'dg-dot' }));
        el.appendChild(text(X(p[0]), y - 30, p[2] + ' ' + p[1], 'dg-name'));
      });
      el.appendChild(svg('line', { x1: X(d.start), y1: y + 34, x2: X(d.end), y2: y + 34, class: 'dg-arrow' }));
      el.appendChild(text((X(d.start) + X(d.end)) / 2, y + 54, d.label, 'dg-ask'));
      return wrap(el, 120, '时间轴');
    }
  };

  function render(d) {
    var fn = kinds[d.kind];
    if (!fn) throw new Error('没有这种图：' + d.kind);
    return fn(d);
  }

  /** 对比表：{ head:[...], rows:[[...], ...] } */
  function table(t) {
    var h = MI.ui.h;

        el.appendChild(text(lx + i * 78 + 22, 37, s.name, 'c-legend', 'start'));

/* 数学岛 · 鸡兔同笼互动

(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};

  MI.types.chickTable = function (box, q, ctx) {
    var h = MI.ui.h, D = q.data;

          h('td', { class: 'ct-cmp', text: ok ? '✔ 正好' : l > L ? '多 ' + (l - L) : '少 ' + (L - l) })
        ]));

    tried.push(x);
    render();
    return {
      value: function () { return x; },
      onWrong: function () {},
      hintFor: function () { var l = legsOf(x); return l === L ? null : '现在脚数是 ' + l + '，和 ' + L + ' 不一样，再调一调' + nA + '的只数。'; },
      reveal: function () { x = q.answer; tried.push(x); render(); },
      lock: function () { locked = true; box.querySelectorAll('.ct-ctrl button').forEach(function (b2) { b2.disabled = true; }); },
      destroy: function () {}
    };
  };

  MI.types.drawLegs = function (box, q, ctx) {
    var h = MI.ui.h, svg = MI.ui.svg, D = q.data;
    var H = D.heads, L = D.legs;
    var four = [], step = 0, locked = false;
    for (var i = 0; i < H; i++) four.push(false);
    var perRow = H <= 6 ? H : Math.ceil(H / 2), rows = Math.ceil(H / perRow);
    var W = 340, cw = W / perRow, rh = 96;
    var el = svg('svg', { viewBox: '0 0 ' + W + ' ' + rows * rh, class: 'figure legs-fig', role: 'group', 'aria-label': '画图法' });
    var animals = [];
    for (var k = 0; k < H; k++) {
      (function (k) {
        var cx = cw * (k % perRow + 0.5), cy = Math.floor(k / perRow) * rh + 30;
        var g = svg('g', { class: 'animal', role: 'button', tabindex: '0', 'aria-label': '第 ' + (k + 1) + ' 只' });
        g.appendChild(svg('rect', { x: cx - cw / 2 + 2, y: cy - 28, width: cw - 4, height: rh - 6, rx: 12, class: 'animal-hit' }));
        g.appendChild(svg('ellipse', { cx: cx, cy: cy + 10, rx: Math.min(20, cw / 2.6), ry: 14, class: 'animal-body' }));
        g.appendChild(svg('circle', { cx: cx, cy: cy - 10, r: 11, class: 'animal-head' }));
        var legs = svg('g', { class: 'legs' });
        g.appendChild(legs);
        g.addEventListener('click', function () { toggle(k); });
        g.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(k); } });
        el.appendChild(g);
        animals.push({ g: g, legs: legs, cx: cx, cy: cy });
      })(k);
    }
    function drawLegsOf(an, n) {
      an.legs.innerHTML = '';
      var xs = n === 4 ? [-13, -5, 5, 13] : [-6, 6];
      xs.slice(0, n).forEach(function (dx, j) {
        an.legs.appendChild(svg('line', { x1: an.cx + dx, y1: an.cy + 20, x2: an.cx + dx, y2: an.cy + 40, class: 'leg' + (n === 4 && (j === 0 || j === 3) ? ' added' : '') }));
      });
    }
    function total() { return step === 0 ? 0 : four.reduce(function (s, f) { return s + (f ? 4 : 2); }, 0); }
    function render() {
      animals.forEach(function (an, k) { drawLegsOf(an, step === 0 ? 0 : four[k] ? 4 : 2); an.g.classList.toggle('rabbit', four[k]); });
      var t = total();
      counter.textContent = step === 0 ? '共 ' + H + ' 个头，还没画脚' : '现在一共 ' + t + ' 只脚，实际有 ' + L + ' 只' + (t === L ? ' ✔' : t < L ? '，还差 ' + (L - t) + ' 只' : '，多了 ' + (t - L) + ' 只');
      counter.classList.toggle('ok', step && t === L);
      firstBtn.hidden = step !== 0;
      tip.textContent = step === 0 ? '第 1 步：先给每个头都画 2 只脚。' : '第 2 步：多出来的脚两只两只补上——点一只动物，给它再加 2 只脚（变成兔）；再点一下可以去掉。';
    }
    function toggle(k) {
      if (locked) return;
      if (step === 0) { MI.ui.toast('先给每只都画 2 只脚'); return; }
      four[k] = !four[k];
      MI.sound.play(total() === L ? 'correct' : 'tap');
      render(); ctx.changed();
    }
    var tip = h('p', { class: 'widget-tip' });
    var counter = h('p', { class: 'ct-status', 'aria-live': 'polite' });
    var firstBtn = h('button', { type: 'button', class: 'btn btn-primary btn-block', text: '每只先画 2 只脚', onclick: function () { if (locked) return; step = 1; MI.sound.play('tap'); render(); ctx.changed(); } });
    box.appendChild(tip);
    box.appendChild(h('div', { class: 'figure-wrap' }, el));
    box.appendChild(counter);
    box.appendChild(firstBtn);
    render();
    return {
      value: function () { return step === 0 ? null : four.filter(Boolean).length; },
      incomplete: function () { return '先给每只画 2 只脚'; },
      onWrong: function () {},
      hintFor: function () { var t = total(); return t === L ? null : '现在是 ' + t + ' 只脚，' + (t < L ? '还差 ' + (L - t) + ' 只，再补 ' + (L - t) / 2 + ' 只兔' : '多了，去掉几只兔的脚'); },
      reveal: function () { step = 1; four = four.map(function (f, k) { return k < q.answer; }); render(); },
      lock: function () { locked = true; firstBtn.disabled = true; },
      destroy: function () {}
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>/* js/units/u1-big-numbers.js */
/* 第①单元 · 大数的认识

 * 所有答案都由代码计算。 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  var N = MI.num, U = MI.util;
  var read = N.toChineseReading;
  var PLACE = N.PLACE_NAMES, CU = N.COUNT_UNITS, FULL = N.UNIT_FULL;

  // ---------------------------------------------------------------
  // 小工具
  // ---------------------------------------------------------------

  /** 位数范围（按难度）：1 基础 / 2 提高 / 3 挑战 */
  var LEN = { 1: [5, 8], 2: [7, 10], 3: [9, 12] };

  /** 随机生成 len 位数字串，首位不为 0；zeroP 控制 0 出现的概率 */
  function randDigits(rng, len, zeroP) {
    var s = String(rng.int(1, 9));
    for (var i = 1; i < len; i++) s += rng.chance(zeroP) ? '0' : String(rng.int(1, 9));
    return s;
  }
  function randLen(rng, d) { return rng.int(LEN[d][0], LEN[d][1]); }

  /** 数字串里从右往左第 p 位的数字 */
  function dig(s, p) { return Number(s[s.length - 1 - p]); }

  /** 把读法切成拼读块：三｜亿｜零｜二百｜万｜零｜五百 */
  function tokenize(reading) {

  }

  /** 选项：去重、打乱，保证正确答案在里面 */
  function options(rng, correct, wrongs, k) {
    var w = U.uniq(wrongs.filter(function (x) { return x !== correct && x != null; }));
    w = rng.shuffle(w).slice(0, (k || 4) - 1);
    return rng.shuffle([correct].concat(w));
  }

  /** 读数讲解（逐级） */
  function readingExplain(n) {
    var segs = N.readingSegments(n);
    var out = ['从右往左四位一级分级 → ' + N.splitLevelsText(n)];
    segs.forEach(function (seg) {

      if (!seg.text) {
        if (seg.level === 0) out.push('个级 ' + seg.digits + ' 全是 0，什么也不读');
        else out.push(label + ' ' + seg.digits + ' 全是 0，这一级不读，“' + N.LEVEL_NAMES[seg.level] + '”字也不读');
        return;
      }
      var note = [];
      if (seg.text.charAt(0) === '零') note.push('前面有 0，只读一个“零”');
      if (/0$/.test(seg.digits) && seg.level > 0) note.push('这一级末尾的 0 不读');
      if (/0$/.test(seg.digits) && seg.level === 0 && segs.length > 1) note.push('末尾的 0 不读');
      var how = seg.level > 0 ? '（先按个级的读法读，再加“' + N.LEVEL_NAMES[seg.level] + '”）' : '';
      out.push('读' + label + '：' + seg.digits + ' → “' + seg.text + '”' + how + (note.length ? '，' + note.join('，') : ''));
    });
    out = U.steps(out);
    out.push('合起来读作：' + read(n));
    return out;
  }

  /** 写数讲解（逐级） */
  function writingExplain(n) {
    var segs = N.readingSegments(n);

  // ---------------------------------------------------------------

  var skills = [
    { id: 'place', name: '计数单位和数位' },
    { id: 'levels', name: '数级与分级' },

  // ---------------------------------------------------------------
  // 生成器。每个生成器：{ skill, levels, weight?, gen(rng, d) → 题目 }
  // ---------------------------------------------------------------
  var G = {};

  // ① 数字在哪一位、表示多少

  G.placeOfDigit = {
    skill: 'place', levels: [1, 2, 3], weight: 1.2,
    gen: function (rng, d) {
      var s, p, x;

        for (var i = 1; i < s.length; i++) {

    }

  // ② 计数单位之间的进率
  // 基础：10 个某单位是多少（千→千亿范围内）；提高：1 个大单位里有几个小单位（10 或 100）；挑战：100/1000 个某单位是多少
  G.unitRate = {
    skill: 'place', levels: [1, 2, 3],

        };

          ])

      return {

        var ans = opts.filter(function (x) {
          var a = Number(s.slice(0, i) + x + s.slice(i + 1)), b = Number(t);
          return op === '>' ? a > b : a < b;
        });
        if (!ans.length || ans.length === opts.length) continue;
        var A = s.slice(0, i) + '□' + s.slice(i + 1);
        var bd = t[i];
        var a0 = Number(s.slice(0, i) + bd + s.slice(i + 1)), b0 = Number(t);
        var eqNote = '□ 填 ' + bd + ' 时这一位相同，要往后比：' + a0 + (a0 > b0 ? ' > ' : a0 < b0 ? ' < ' : ' = ') + b0 + '，' + (ans.indexOf(bd) >= 0 ? '成立' : '不成立');
        return {
          type: 'multi',
          prompt: '□ 里可以填哪些数字？把能填的都选上。',
          data: { show: A + ' ' + op + ' ' + t, options: opts },
          answer: ans,
          hint: '两个数位数相同，从最高位比起；□ 和对面那一位相同时，还要往后比。',
          explanation: U.steps([
            '两个数都是 ' + len + ' 位数，从最高位起比',
            (i > 0 ? '前面几位都相同，' : '') + '比 □ 所在的' + PLACE[len - 1 - i] + '：要' + (op === '>' ? '大于' : '小于') + ' ' + bd,
            eqNote,
            '所以 □ 里可以填：' + ans.join('、')
          ])
        };
      }
    }
  };

  // ⑯ 最大 / 最小的数
  G.largest = {
    skill: 'compare', levels: [1, 2],
    gen: function (rng, d) {
      var len = rng.int(6, 9), base = randDigits(rng, len, 0.3);
      var nums = [base];
      var guard = 0;
      while (nums.length < 4 && guard++ < 100) {
        var c;
        if (d === 1) c = randDigits(rng, len + rng.pick([-1, 0, 0, 1]), 0.3);
        else { var i = rng.int(1, len - 1); c = base.slice(0, i) + randDigits(rng, len - i, 0.3).replace(/^./, String(rng.int(0, 9))); }
        if (nums.indexOf(c) < 0) nums.push(c);
      }
      var wantMax = rng.chance(0.5);
      var sorted = nums.slice().sort(function (x, y) { return Number(y) - Number(x); });
      var ans = wantMax ? sorted[0] : sorted[sorted.length - 1];
      return {
        type: 'choice',
        prompt: '下面的数中，' + (wantMax ? '最大' : '最小') + '的是（　）。',
        data: { options: rng.shuffle(nums) },
        answer: ans,
        hint: '先比位数，位数相同再从最高位比起。',
        explanation: U.steps(['把这几个数从大到小排一排：' + sorted.join(' > '), (wantMax ? '最大' : '最小') + '的是 ' + ans])
      };
    }
  };

  // ⑰ 改写成“万”“亿”作单位
  G.rewrite = {
    skill: 'rewrite', levels: [1, 2, 3], weight: 1.2,
    gen: function (rng, d) {
      var unit = d === 1 ? '万' : d === 2 ? '亿' : rng.pick(['万', '亿']);
      var k = unit === '万' ? rng.int(2, 9999) : rng.int(2, 999);
      var n = k * N.unitValue(unit);
      var zeros = unit === '万' ? 4 : 8;
      var expl = U.steps([
        n + ' 是整' + unit + '数，末尾至少有 ' + zeros + ' 个 0',
        '去掉末尾 ' + zeros + ' 个 0，加上“' + unit + '”字',
        '改写是准确数，用“=”连接：' + n + ' = ' + k + unit
      ]);
      if (d === 3) {
        return {
          type: 'fill',
          prompt: '把 ' + n + ' 改写成用“' + unit + '”作单位的数（记得选对符号）。',
          data: { template: n + ' []', keys: ['=', '≈', '万', '亿'], prefix: String(n) },
          answer: '=' + k + unit,
          hint: '改写是准确数，用“=”；去掉末尾 ' + zeros + ' 个 0，再加“' + unit + '”。',
          explanation: expl
        };
      }
      return {
        type: 'fill',
        prompt: '把 ' + n + ' 改写成用“' + unit + '”作单位的数。',
        data: { template: n + ' = [] ' + unit, suffix: unit },
        answer: String(k),
        hint: '去掉末尾 ' + zeros + ' 个 0。',
        explanation: expl
      };
    }
  };

  // ⑱ 选“=”还是“≈”
  G.symbol = {
    skill: 'rewrite', levels: [1, 2],
    gen: function (rng, d) {
      var unit = d === 1 ? '万' : rng.pick(['万', '亿']);
      var uv = N.unitValue(unit);
      var exact = rng.chance(0.5);
      var n, k;
      if (exact) { k = unit === '万' ? rng.int(2, 999) : rng.int(2, 99); n = k * uv; }
      else {
        do { n = rng.int(2 * uv, (unit === '万' ? 999 : 99) * uv); } while (n % uv === 0);
        k = N.approx(n, unit);
      }
      return {
        type: 'choice',
        prompt: '在 ○ 里填“=”还是“≈”？',
        data: { show: n + ' ○ ' + k + unit, options: ['=', '≈'], big: true },
        answer: exact ? '=' : '≈',
        hint: '看看 ' + n + ' 和 ' + k + unit + ' 是不是正好相等。',
        explanation: exact
          ? U.steps([n + ' 是整' + unit + '数，去掉末尾 0 改写后和原数正好相等', '改写用“=”：' + n + ' = ' + k + unit])
          : U.steps([n + ' 不是整' + unit + '数，' + k + unit + ' 是四舍五入得到的近似数', '求近似数用“≈”：' + n + ' ≈ ' + k + unit])
      };
    }
  };

  /** 求近似数用的数字 */
  function roundNumber(rng, d, unit) {
    var uv = N.unitValue(unit), lp = N.lookPlace(unit);
    for (;;) {
      var len = unit === '万' ? (d === 1 ? rng.int(5, 7) : rng.int(6, 9)) : rng.int(9, 11);
      var s = randDigits(rng, len, 0.25);
      if (d === 3 && rng.chance(0.6)) {
        // 挑战题的陷阱：①看的那一位 ≥ 5，前面是 9，进一后要连续进位（如 495000 ≈ 50万）
        //            ②看的那一位是 4，后面全是 9，也要舍去（如 449999 ≈ 45万）
        var cut = len - 1 - lp; // 要看的那一位在字符串里的下标
        if (cut < 1) continue;
        var head = s.slice(0, cut), look, tail;
        if (rng.chance(0.5)) {
          var nines = Math.min(head.length, rng.int(1, 2));
          head = head.slice(0, head.length - nines) + '99'.slice(0, nines);
          look = String(rng.int(5, 9));
          tail = s.slice(cut + 1);
        } else {
          look = '4';
          tail = '99999999999'.slice(0, len - cut - 1);
        }
        s = head + look + tail;
      }
      var n = Number(s);
      if (n % uv !== 0 && n >= uv) return n;
    }
  }

  // ⑲ 求近似数：先点出“看哪一位”，再填写
  G.roundDigit = {
    skill: 'approx', levels: [1, 2, 3], weight: 1.6,
    gen: function (rng, d) {
      var unit = d === 1 ? '万' : rng.chance(0.6) ? '万' : '亿';
      var n = roundNumber(rng, d, unit);
      var lp = N.lookPlace(unit), uv = N.unitValue(unit);
      var look = N.digitAt(n, lp), trunc = Math.floor(n / uv), k = N.approx(n, unit);
      var up = look >= 5;
      var data = { n: String(n), unit: unit, look: lp };
      var ans;
      if (d === 1) { data.template = n + ' ≈ [] 万'; data.suffix = '万'; ans = String(k); }
      else { data.template = n + ' []'; data.keys = ['≈', '=', '万', '亿']; data.prefix = String(n); ans = '≈' + k + unit; }
      return {
        type: 'round',
        prompt: '省略“' + unit + '”位后面的尾数，求近似数。先点一点：要看哪一位？',
        data: data,
        answer: ans,
        hint: '省略' + unit + '位后面的尾数，看' + unit + '位的下一位——' + PLACE[lp] + '。',
        explanation: U.steps([
          '省略' + unit + '位后面的尾数，要看' + unit + '位的下一位：' + PLACE[lp],
          PLACE[lp] + '上是 ' + look + '，' + (up ? look + ' ≥ 5，向' + unit + '位进一' : look + ' < 5，把尾数舍去'),
          up ? trunc + unit + ' 进一变成 ' + k + unit : '剩下 ' + k + unit,
          '求近似数用“≈”：' + n + ' ≈ ' + k + unit
        ])
      };
    }
  };

  // ⑳ 近似数倒推：最大是几、最小是几
  G.roundRange = {
    skill: 'approx', levels: [2, 3],
    gen: function (rng, d) {
      var unit = d === 3 && rng.chance(0.4) ? '亿' : '万';
      var uv = N.unitValue(unit);
      var k = unit === '万' ? rng.int(1, 99) : rng.int(1, 30);
      var max = k * uv + uv / 2 - 1, min = k * uv - uv / 2;
      var lp = N.lookPlace(unit);
      return {
        type: 'fill',
        prompt: '一个整数省略“' + unit + '”位后面的尾数约是 ' + k + unit + '。这个数最大是多少？最小是多少？',
        data: { template: '最大是 []\n最小是 []' },
        answer: [String(max), String(min)],
        hint: '最大的数是“舍”来的，' + PLACE[lp] + '最大是 4；最小的数是“入”来的，' + PLACE[lp] + '最小是 5。',
        explanation: U.steps([
          '最大：是把尾数“舍”掉得来的，' + unit + '位上还是 ' + (k % 10) + '，' + PLACE[lp] + '最大填 4，后面都填 9 → ' + max,
          '最小：是“入”上来的，' + unit + '位上原来比现在少 1，' + PLACE[lp] + '最小填 5，后面都填 0 → ' + min,
          '所以最大是 ' + max + '，最小是 ' + min
        ])
      };
    }
  };

  // ㉑ □ 里能填几（近似数）
  G.roundBox = {
    skill: 'approx', levels: [2, 3], weight: 1.2,
    gen: function (rng, d) {
      var unit = '万', lp = 3;
      for (;;) {
        var len = rng.int(6, d === 2 ? 7 : 9);
        var s = randDigits(rng, len, 0.25);
        var p = rng.chance(d === 2 ? 0.7 : 0.4) ? lp : lp + 1; // □ 在千位或万位
        var i = len - 1 - p;
        if (i < 0) continue;
        var opts = U.range(i === 0 ? 1 : 0, 9).map(String);
        var x0 = rng.pick(opts);
        var target = N.approx(Number(s.slice(0, i) + x0 + s.slice(i + 1)), unit);
        var ans = opts.filter(function (x) { return N.approx(Number(s.slice(0, i) + x + s.slice(i + 1)), unit) === target; });
        if (ans.length === opts.length) continue;
        var A = s.slice(0, i) + '□' + s.slice(i + 1);
        var why;
        if (p === lp) {
          var up = Number(ans[0]) >= 5;
          why = '□ 在千位，正是要“看”的那一位。要得到 ' + target + '万，' + (up ? '必须向万位进一，所以 □ ≥ 5' : '要把尾数舍去，所以 □ < 5');
        } else {
          var lk = Number(s[len - 1 - lp]);
          why = '□ 在万位。千位上是 ' + lk + '，' + (lk >= 5 ? lk + ' ≥ 5，要向万位进一，所以 □ 要比结果的万位小 1' : lk + ' < 5，尾数舍去，□ 就是结果的万位');
        }
        return {
          type: 'multi',
          prompt: '□ 里可以填哪些数字？把能填的都选上。',
          data: { show: A + ' ≈ ' + target + '万', options: opts },
          answer: ans,
          hint: '省略万位后面的尾数要看千位。把 0～9 放进 □ 里试一试。',
          explanation: U.steps(['省略万位后面的尾数，看千位', why, '所以 □ 里可以填：' + ans.join('、')])
        };
      }
    }
  };

  // ㉒ 1 亿有多大（叠纸）
  G.paperYi = {
    skill: 'yi', levels: [1, 2],
    gen: function (rng, d) {
      var sizes = [{ n: 1e4, t: '1 万' }, { n: 1e5, t: '10 万' }, { n: 1e6, t: '100 万' }, { n: 1e7, t: '1000 万' }, { n: 1e8, t: '1 亿' }];
      var pickI = d === 1 ? rng.int(0, 3) : rng.int(2, 4);
      var it = sizes[pickI];
      var cm = it.n / 100, m = it.n / 1e4;
      var fmt = function (x) { return x + ' 米'; };
      var ans = fmt(m);
      var wrongs = [fmt(m * 10), fmt(m * 100), m >= 10 ? fmt(m / 10) : fmt(m * 1000), fmt(cm)];
      return {
        type: 'choice',
        prompt: '100 张纸叠起来大约厚 1 厘米。' + it.t + '张纸叠起来大约高多少米？',
        data: { options: options(rng, ans, wrongs) },
        answer: ans,
        hint: '先算有几个 100 张，就是几厘米；再想 100 厘米 = 1 米。',
        explanation: U.steps([
          it.t + '里面有 ' + cm + ' 个 100，所以大约厚 ' + cm + ' 厘米',
          '100 厘米 = 1 米，' + cm + ' 厘米 = ' + m + ' 米',
          it.n === 1e8 ? '1 亿张纸大约高 10000 米，比珠穆朗玛峰（约 8849 米）还高！' : '所以大约高 ' + m + ' 米'
        ])
      };
    }
  };

  // ㉓ 读算盘
  G.abacus = {
    skill: 'history', levels: [1, 2],
    gen: function (rng, d) {
      var rods = d === 1 ? 4 : 5;
      var s = randDigits(rng, rods, d === 1 ? 0.15 : 0.3);
      var n = Number(s);
      return {
        type: 'abacus',
        prompt: '算盘上表示的数是多少？（上珠一颗表示 5，下珠一颗表示 1，靠近横梁的珠子才算数）',
        data: { digits: s, template: '[]' },
        answer: s,
        hint: '一档一档看：靠梁的上珠算 5，靠梁的下珠一颗算 1。',
        explanation: U.steps(s.split('').map(function (c, i) {
          var v = Number(c), up = v >= 5 ? 1 : 0, low = v % 5;
          return PLACE[rods - 1 - i] + '：' + (up ? '上珠 1 颗（5）' : '') + (up && low ? ' + ' : '') + (low ? '下珠 ' + low + ' 颗（' + low + '）' : '') + (!v ? '没有珠子靠梁（0）' : '') + ' → ' + v;
        })).concat(['合起来是 ' + n])
      };
    }
  };

  // ㉔ 判断题（答案由代码计算）
  G.judgeMix = {
    skill: 'read', levels: [1, 2],
    gen: function (rng, d) {
      var kind = rng.int(0, 3);
      var n, truth, prompt, expl, hint, skill;
      if (kind === 0) {
        n = readNumber(rng, d);
        var r = read(n), wr = U.uniq(wrongReadings(n));
        truth = !wr.length || rng.chance(0.5);
        var shown = truth ? r : rng.pick(wr);
        prompt = n + ' 读作：' + shown + '。';
        skill = 'read'; hint = '分级读一读，注意哪些 0 要读。'; expl = readingExplain(n);
      } else if (kind === 1) {
        do { n = rng.int(20000, 9999999); } while (n % 10000 === 0);
        var k = N.approx(n, '万');
        var kk = rng.chance(0.5) ? k : k + (Math.floor(n / 1e4) === k ? 1 : -1);
        truth = kk === k;
        prompt = '省略万位后面的尾数：' + n + ' ≈ ' + kk + '万。';
        skill = 'approx'; hint = '看千位：≥ 5 进一，< 5 舍去。';
        expl = U.steps(['看千位：千位上是 ' + N.digitAt(n, 3), N.digitAt(n, 3) >= 5 ? '≥ 5，向万位进一' : '< 5，舍去', n + ' ≈ ' + k + '万，所以这句话' + (truth ? '对' : '错')]);
      } else if (kind === 2) {
        var len = rng.int(6, 11);
        n = Number(randDigits(rng, len, 0.3));
        var claim = rng.chance(0.5) ? len : len + rng.pick([-1, 1]);
        truth = claim === len;
        prompt = n + ' 是一个 ' + claim + ' 位数，最高位是' + PLACE[claim - 1] + '。';
        skill = 'place'; hint = '数一数一共有几位数字。';
        expl = U.steps([n + ' 一共有 ' + len + ' 位数字，是 ' + len + ' 位数', '最高位是' + PLACE[len - 1] + '，所以这句话' + (truth ? '对' : '错')]);
      } else {
        var exact = rng.chance(0.5), kw = rng.int(2, 999);
        n = exact ? kw * 1e4 : kw * 1e4 + rng.int(1, 9999);
        truth = exact;
        prompt = n + ' = ' + (exact ? kw : N.approx(n, '万')) + '万。';
        skill = 'rewrite'; hint = '“=”表示正好相等，近似数要用“≈”。';
        expl = exact ? U.steps([n + ' 是整万数，去掉末尾 4 个 0 正好是 ' + kw + '万', '用“=”没错，这句话对'])
          : U.steps([n + ' 不是整万数，只能求近似数', '近似数要用“≈”，这句话错']);
      }
      return {
        type: 'judge', skill: skill,
        prompt: '判断对错：' + prompt,
        data: {},
        answer: truth,
        hint: hint,
        explanation: expl
      };
    }
  };

  // ---------------------------------------------------------------
  // 少量精选固定题（概念题）。用 seed 选第几题，所以也能原样重现。
  // ---------------------------------------------------------------
  var fixed = [
    { skill: 'natural', prompt: '0 是最小的自然数。', answer: true, explanation: ['0、1、2、3……都是自然数，0 是最小的。'] },
    { skill: 'natural', prompt: '1 是最小的自然数。', answer: false, explanation: ['一个物体也没有用 0 表示，0 也是自然数，最小的自然数是 0。'] },
    { skill: 'natural', prompt: '最大的自然数是 999999999999。', answer: false, explanation: ['不管多大的数，加 1 还是自然数，所以没有最大的自然数。'] },
    { skill: 'natural', prompt: '自然数的个数是无限的。', answer: true, explanation: ['没有最大的自然数，所以自然数有无限多个。'] },
    { skill: 'place', prompt: '“万”是数位，“万位”是计数单位。', answer: false, explanation: ['说反啦：“万”是计数单位，“万位”是数位。'] },
    { skill: 'place', prompt: '每相邻两个计数单位之间的进率都是 10。', answer: true, explanation: ['10 个一是十，10 个十是一百……这叫十进制计数法。'] },
    { skill: 'levels', prompt: '分级时，从右往左每三位一级。', answer: false, explanation: ['我们的读法是从右往左每四位一级：个级、万级、亿级。'] },
    { skill: 'rewrite', prompt: '改写和求近似数，都用“=”连接。', answer: false, explanation: ['改写是准确数，用“=”；求近似数用“≈”。'] },
    { skill: 'history', prompt: '阿拉伯数字最早是由古印度人发明的。', answer: true, explanation: ['阿拉伯数字最早由古印度人发明，后来经阿拉伯人传到欧洲。'] },
    { skill: 'history', prompt: '在算盘上，一颗上珠表示 1。', answer: false, explanation: ['上珠一颗表示 5，下珠一颗表示 1。'] }
  ];

  skills.forEach(function (s) {
    if (!fixed.some(function (f) { return f.skill === s.id; })) return;
    G['concept_' + s.id] = {
      skill: s.id, levels: [1, 2], weight: s.id === 'natural' ? 1 : 0.5,
      gen: (function (sid) {
        return function (rng) {
          var list = fixed.filter(function (f) { return f.skill === sid; });
          var f = rng.pick(list);
          return { type: 'judge', prompt: '判断对错：' + f.prompt, data: {}, answer: f.answer, hint: '想一想课本上是怎么说的。', explanation: f.explanation.slice() };
        };
      })(s.id)
    };
  });

  MI.registerUnit({ id: 'u1', title: '大数的认识', cards: cards, skills: skills, generators: G, fixed: fixed });
  // 供测试使用
  MI.u1 = { tokenize: tokenize, naiveReading: naiveReading, readingExplain: readingExplain };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>/* js/units/u2-angles.js */
/* 第②单元 · 角的度量
 * 本文件只放内容：知识卡、知识点、题目生成器。所有答案都由代码计算。 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  var U = MI.util;

  function options(rng, correct, wrongs, k) {
    var w = U.uniq(wrongs.filter(function (x) { return x !== correct && x != null; }));
    w = rng.shuffle(w).slice(0, (k || 4) - 1);

  }
  /** 按度数分类 */
  function kindOf(d) { return d < 90 ? '锐角' : d === 90 ? '直角' : d < 180 ? '钝角' : d === 180 ? '平角' : '周角'; }
  var KINDS = ['锐角', '直角', '钝角', '平角', '周角'];
  var RANGE = { '锐角': '大于 0°、小于 90°', '直角': '等于 90°', '钝角': '大于 90°、小于 180°', '平角': '等于 180°', '周角': '等于 360°' };

  var cards = [

  var cards = [
    {

  <script>/* js/units/u7-treasure.js */
/* 综合实践 · 寻找宝藏（新增）

(function (root) {

  function inside(p) { return p[0] >= 0 && p[1] >= 0 && p[0] < COLS && p[1] < ROWS; }
  function key(p) { return p[0] + ',' + p[1]; }
  /** 按路线走：返回经过的每一格（含起点），走出地图返回 null */

  }
  /** 拐点（画路线用） */
  function corners(start, legs) {
    var p = start.slice(), out = [p.slice()];

    return out;
  }
  /** 随机一条路线：每段方向不同、不往回走，最后不回到起点 */
  function randomRoute(rng, nLegs, dirs) {
    for (;;) {

        legs.push({ dir: rng.pick(cands), n: rng.int(1, 4) });

  <script>/* js/units/u9-final.js */
/* 期末大挑战（综合）
 * 练一练、闯关测验从前面 8 座岛的题里混合出题（mix），再加几道把单元串起来的“关联题”。
 * 关联关系来自知识清单“复习与关联”：大数读写 ↔ 多位数乘法结果；乘法模型 ↔ 多位数乘法计算；
 * 角的度量 ↔ 平行四边形对角相等；统计图 ↔ 大数比较。 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  var U = MI.util, N = MI.num;

  function options(rng, correct, wrongs, k) {
    var w = U.uniq(wrongs.filter(function (x) { return x !== correct && x != null; }));
    w = rng.shuffle(w).slice(0, (k || 4) - 1);
    return rng.shuffle([correct].concat(w));
  }

  var cards = [
    {
      id: 'links', emoji: '🔗', title: '知识串一串',
      points: ['大数读写 ↔ 多位数乘法的结果：算出来的积，要会读、会写、会求近似数。', '乘法模型 ↔ 多位数乘法计算：总价、路程问题都要列竖式算。', '角的度量 ↔ 平行四边形：平行四边形的对角相等，可以用量角器量一量。', '统计图 ↔ 大数比较：读统计图、统计表里的大数，比较大小。'],
      examples: ['一台电脑 3 千多元，买 25 台要多少元？算出积，再求它约是几万元。'],
      pitfall: '综合题先想：这一步用的是哪个单元的知识？'
    },
    {
      id: 'tips', emoji: '🏁', title: '期末大挑战怎么玩',
      points: ['题目从前面 8 座岛里混合抽取，还有几道“串一串”的关联题。', '做错的题会进错题本，每日一练会优先帮你复习。'],
      examples: ['先在各个小岛把知识卡都“懂了”，再来挑战更轻松。'],
      pitfall: '不会的题先点 💡 提示，不要着急。'
    }
  ];

  var skills = [{ id: 'link', name: '知识串一串' }];
  var G = {};

  // ① 乘法的积 → 读数
  G.productRead = {
    skill: 'link', levels: [1, 2, 3],
    gen: function (rng, d) {
      for (;;) {
        var a = rng.int(d === 1 ? 105 : 201, 999), b = rng.int(d === 1 ? 11 : 21, 99), p = a * b;
        if (p < 10000) continue;
        var r = N.toChineseReading(p);
        var wrongs = [MI.u1.naiveReading(p), N.toChineseReading(p * 10), r.replace(/零/g, ''), N.toChineseReading(p + 1000)].filter(function (w) { return w !== r; });
        if (U.uniq(wrongs).length < 2) continue;
        return {
          type: 'choice', prompt: '工厂每天生产 ' + a + ' 个零件，' + b + ' 天一共生产多少个？这个数读作（　）。',
          data: { options: options(rng, r, wrongs) }, answer: r,
          hint: '先算 ' + a + ' × ' + b + '，再从右往左四位一级分级来读。',
          explanation: U.steps([a + ' × ' + b + ' = ' + p + '（个）', '分级：' + N.splitLevelsText(p), '读作：' + r])
        };
      }
    }
  };

  // ② 总价（多位数乘法）→ 求近似数
  G.priceApprox = {
    skill: 'link', levels: [2, 3],
    gen: function (rng) {
      for (;;) {
        var price = rng.int(150, 990), n = rng.int(21, 98), total = price * n;
        if (total < 15000 || total % 10000 === 0) continue;
        var k = N.approx(total, '万');
        return {
          type: 'fill', prompt: '学校买了 ' + n + ' 套桌椅，每套 ' + price + ' 元。一共要多少元？省略万位后面的尾数约是多少万元？',
          data: { template: '一共 [] 元\n约 [] 万元' }, answer: [String(total), String(k)],
          hint: '先用“总价 = 单价 × 数量”列竖式算，再看千位四舍五入。',
          explanation: U.steps(['总价 = 单价 × 数量：' + price + ' × ' + n + ' = ' + total + '（元）', '省略万位后面的尾数，看千位：' + N.digitAt(total, 3) + (N.digitAt(total, 3) >= 5 ? ' ≥ 5，进一' : ' < 5，舍去'), total + ' ≈ ' + k + '万（元）'])
        };
      }
    }
  };

  // ③ 量角器量平行四边形的角 → 对角相等
  G.pgramAngle = {
    skill: 'link', levels: [1, 2, 3],
    gen: function (rng, d) {
      var deg = rng.int(d === 3 ? 21 : 11, 34) * 5;

      var base = d === 1 ? 'right' : rng.pick(['right', 'left']);
      return {
        type: 'fill', prompt: '用量角器量出平行四边形的一个角（如图的 ∠1）。和它相对的那个角是多少度？',

        hint: '先正确读出 ∠1（看和边重合的 0° 在哪一圈），再想平行四边形对角的关系。',
        explanation: U.steps(['读量角器：和边重合的 0° 在' + (base === 'right' ? '内圈' : '外圈') + '，∠1 = ' + deg + '°', '平行四边形的对角相等', '所以和它相对的角也是 ' + deg + '°'])
      };
    }
  };

  // ④ 统计表里的大数 → 比较大小
  G.bigTable = {
    skill: 'link', levels: [1, 2, 3],
    gen: function (rng, d) {
      var cities = ['甲市', '乙市', '丙市', '丁市'];

      while (vals.length < 4) {
        var v = d === 1 ? rng.int(10, 99) * 100000 : base + rng.int(-99999, 99999);
        if (vals.indexOf(v) < 0) vals.push(v);
      }
      var wantMax = rng.chance(0.5);
      var target = wantMax ? Math.max.apply(null, vals) : Math.min.apply(null, vals);
      var ans = cities[vals.indexOf(target)];
      var sorted = vals.slice().sort(function (a, b) { return b - a; });
      return {
        type: 'choice', prompt: '下表是四个城市某年的旅游人数（单位：人）。哪个城市' + (wantMax ? '最多' : '最少') + '？',
        data: { table: { head: ['城市', '人数'], rows: cities.map(function (c, i) { return [c, String(vals[i])]; }) }, options: cities.slice() },
        answer: ans,
        hint: '位数相同，从最高位起一位一位比。',
        explanation: U.steps(['这几个数都是 ' + String(vals[0]).length + ' 位数，从最高位起比', '从大到小：' + sorted.join(' > '), (wantMax ? '最多' : '最少') + '的是' + ans])
      };

  MI.registerUnit({
    id: 'u9', title: '期末大挑战', cards: cards, skills: skills, generators: G, fixed: [],

    mix: ['u1', 'u2', 'u3', 'u4', 'u5', 'u6', 'u7', 'u8', 'u9']
  });
})(typeof window !== 'undefined' ? window : globalThis);

        h('p', { text: '工程师正在搭桥铺路，很快就能来探险啦。先去别的小岛看看吧！' }),

  // ---------------- 知识卡：左右滑动翻卡 ----------------
  function cardsView(body, unit) {
    var h = MI.ui.h;
    var cards = unit.cards;
    var known = MI.progress.unit(unit.id).cardsKnown;
    var i = 0;
    try { i = Math.min(cards.length - 1, Number(sessionStorage.getItem('mi4a:card:' + unit.id)) || 0); } catch (e) { i = 0; }
    var counter = h('p', { class: 'cards-count' });
    var track = h('div', { class: 'cards-track' });

    var dots = h('div', { class: 'dots', 'aria-hidden': 'true' });
    cards.forEach(function (c, k) {
      var knowBtn = h('button', { type: 'button', class: 'btn know-btn', onclick: function () {

        MI.sound.play(now ? 'correct' : 'tap');
        if (now) MI.ui.celebrate(knowBtn, 6);

      } });
      var card = h('article', { class: 'kcard', 'aria-roledescription': '知识卡', 'aria-label': (k + 1) + '/' + cards.length + ' ' + c.title }, [
        h('div', { class: 'kcard-head' }, [h('span', { class: 'kcard-emoji', 'aria-hidden': 'true', text: c.emoji || '📌' }), h('h2', { class: 'kcard-title', text: c.title })]),
        h('h3', { class: 'kcard-label', text: '要点' }),
        h('ul', { class: 'kcard-points' }, c.points.map(function (p) { return h('li', { text: p }); })),
        c.examples && c.examples.length ? h('h3', { class: 'kcard-label', text: '例子' }) : null,
        c.examples && c.examples.length ? h('ul', { class: 'kcard-examples' }, c.examples.map(function (p) { return h('li', { text: p }); })) : null,
        c.pitfall ? h('div', { class: 'kcard-pitfall' }, [h('b', { text: '⚠️ 易错提醒：' }), c.pitfall]) : null,
        knowBtn
      ]);
      // 每张卡放在一个正好一屏宽的“格子”里，卡片之间的间距在格子内部，翻页时正好移动一整屏
      var slide = h('div', { class: 'kslide' }, card);
      slide._know = knowBtn;
      slide._card = card;

    var next = h('button', { type: 'button', class: 'icon-btn nav-btn', 'aria-label': '下一张', text: '›', onclick: function () { go(i + 1); } });
    body.appendChild(counter);
    body.appendChild(viewport);
    body.appendChild(h('div', { class: 'cards-nav' }, [prev, dots, next]));
    body.appendChild(h('p', { class: 'muted center', text: '左右滑动翻卡。看懂了就点“我懂了”。' }));

    function update() {

      counter.textContent = '第 ' + (i + 1) + ' / ' + cards.length + ' 张 · 已懂 ' + n + ' 张';

  // ---------------- 练一练：选难度 ----------------

      h('button', { type: 'button', class: 'btn btn-primary btn-block btn-lg', text: '开始练习 ✏️', onclick: function () {
        MI.store.set('lastDiff', chosen);

      } })
    ]));
    (unit.extras || []).forEach(function (x) {
      body.appendChild(h('a', { href: x.href, class: 'card extra-card' }, [
        h('span', { class: 'extra-icon', 'aria-hidden': 'true', text: x.icon }),
        h('span', { class: 'extra-text' }, [h('b', { text: x.title }), h('span', { class: 'muted', text: x.desc })]),
        h('span', { class: 'muted', text: '›' })
      ]));
    });
    body.appendChild(skillList(unit));
  }

  function skillList(unit) {
    var h = MI.ui.h;
    return h('section', { class: 'card' }, [
      h('h2', { class: 'card-title', text: '我的知识点' }),
      h('ul', { class: 'skill-list' }, unit.skills.map(function (s) {
        var st = MI.progress.skillStat(unit.id, s.id);
        var pct = st.a ? Math.round(st.c / st.a * 100) : null;
        return h('li', { class: 'skill' }, [
          h('span', { class: 'skill-name', text: s.name }),
          h('span', { class: 'skill-bar' }, h('span', { class: 'skill-fill', style: { width: (pct || 0) + '%' } })),
          h('span', { class: 'skill-pct', text: pct == null ? '未练' : pct + '%' })
        ]);
      }))
    ]);
  }

  // ---------------- 闯关测验 ----------------
  function quizView(body, unit) {
    var h = MI.ui.h;
    var up = MI.progress.unit(unit.id);
    body.appendChild(h('section', { class: 'card quiz-card' }, [
      h('div', { class: 'quiz-best' }, [h('span', { class: 'muted', text: '最好成绩' }), MI.ui.stars(up.bestStars), up.quizCount ? h('span', { class: 'muted', text: '最高 ' + up.bestScore + ' 分 · 闯过 ' + up.quizCount + ' 次' }) : h('span', { class: 'muted', text: '还没闯过关' })]),
      h('h2', { class: 'card-title', text: '15 道题，由易到难' }),
      h('ul', { class: 'rules' }, [
        h('li', {}, ['一次答对 60% 以上：', MI.ui.stars(1)]),
        h('li', {}, ['一次答对 80% 以上：', MI.ui.stars(2)]),
        h('li', {}, ['全部一次答对：', MI.ui.stars(3)])
      ]),
      h('p', { class: 'muted', text: '答错了也能看提示、再试一次，只是不算“一次答对”。星星只保留最高纪录。' }),
      h('button', { type: 'button', class: 'btn btn-primary btn-block btn-lg', text: '开始闯关 🏆', onclick: function () { MI.router.go('#/play/' + unit.id + '/quiz'); } })
    ]));
  }

  // ---------------- 做题页 ----------------
  MI.pages.play = function (app, uid, mode, d) {
    var isl = MI.island(uid);

      again: true
    });
  };

  <script>/* js/pages/blitz.js */
/* 数学岛 · 口算挑战（60 秒，可选，只用于口算乘法）
 * 平时做题都不计时；这里是单独的小游戏。题目来自单元里标了 data.blitz 的口算生成器。 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  MI.pages = MI.pages || {};
  var SECONDS = 60;

  /** 收集能用于口算挑战的生成器（先试出一道题看是否标记了 blitz） */
  function blitzRefs(uid) {
    var u = MI.units[uid], out = [];
    Object.keys(u.generators).forEach(function (gid) {
      u.generators[gid].levels.forEach(function (d) {
        var q = MI.makeQuestion({ unit: uid, gen: gid, seed: 1, d: d });
        if (q.data.blitz) out.push({ gen: gid, d: d });
      });
    });
    return out;
  }

  MI.pages.blitz = function (app, uid) {
    var h = MI.ui.h, isl = MI.island(uid);
    if (!isl || !MI.units[uid]) { MI.router.go('#/'); return; }
    var refs = blitzRefs(uid);
    var page = h('div', { class: 'page play blitz' });
    page.style.setProperty('--theme', isl.color);
    page.style.setProperty('--theme-deep', MI.util.shade(isl.color, -0.25));
    page.style.setProperty('--tl-l', MI.util.shade(isl.color, 0.85));
    page.style.setProperty('--tl-d', MI.util.shade(isl.color, -0.68));
    document.body.style.setProperty('--theme', isl.color);
    document.body.style.setProperty('--theme-deep', MI.util.shade(isl.color, -0.25));
    var timerEl = h('span', { class: 'blitz-timer', text: SECONDS + '″' });
    var scoreEl = h('span', { class: 'blitz-score', text: '✔ 0' });
    var bar = h('div', { class: 'progress-fill', style: { width: '100%' } });
    page.appendChild(h('header', { class: 'play-top' }, [
      h('a', { href: '#/unit/' + uid + '/practice', class: 'icon-btn', 'aria-label': '离开', text: '✕' }),
      h('div', { class: 'progress' }, bar), timerEl, scoreEl
    ]));
    var main = h('main', { class: 'play-main' });
    page.appendChild(main);
    app.appendChild(page);

    var best = MI.store.get('blitz', {})[uid] || 0;
    var timer = null, ctrl = null, q = null, right = 0, total = 0, endAt = 0, running = false;

    function intro() {
      main.innerHTML = '';
      main.appendChild(h('section', { class: 'result' }, [
        h('div', { class: 'result-emoji', text: '⏱️' }),
        h('h2', { class: 'result-title', text: '口算挑战' }),
        h('p', { text: '60 秒内，能答对几道口算乘法？答错了不扣分，直接下一题。' }),
        h('p', { class: 'result-score' }, ['最好成绩：', h('b', { text: best }), ' 道']),
        h('div', { class: 'result-actions' }, [h('button', { type: 'button', class: 'btn btn-primary btn-block btn-lg', text: '开始！', onclick: start })])
      ]));
    }

    function start() {
      right = 0; total = 0; running = true;
      endAt = Date.now() + SECONDS * 1000;
      MI.router.setGuard(function (proceed) {
        if (!running) { proceed(); return; }
        MI.ui.modal({ emoji: '⏱️', title: '挑战还没结束', body: '现在离开，这次成绩不算哦。', buttons: [{ text: '先离开', onClick: proceed }, { text: '继续挑战', primary: true }] });
      });
      timer = setInterval(tick, 100);
      next();
    }
    function tick() {
      var left = Math.max(0, endAt - Date.now());
      timerEl.textContent = Math.ceil(left / 1000) + '″';
      bar.style.width = (left / (SECONDS * 1000) * 100) + '%';
      timerEl.classList.toggle('hurry', left < 10000);
      if (left <= 0) finish();
    }
    function next() {
      if (ctrl) ctrl.destroy();
      var r = refs[Math.floor(Math.random() * refs.length)];
      q = MI.makeQuestion({ unit: uid, gen: r.gen, seed: MI.newSeed(), d: r.d });
      main.innerHTML = '';
      var card = h('section', { class: 'q-card blitz-card' });
      var wbox = h('div', { class: 'q-widget' });
      card.appendChild(wbox);
      main.appendChild(card);
      ctrl = MI.types.fill(wbox, q, { submit: submit, changed: function () {} });
    }
    function submit() {
      if (!running) return;
      var v = ctrl.value();
      if (v == null) return;
      total++;
      var ok = MI.check(q, v);
      MI.progress.recordAnswer(q, ok);
      var card = main.querySelector('.q-card');
      if (ok) {
        right++;
        scoreEl.textContent = '✔ ' + right;
        MI.sound.play('correct');
        next();
      } else {
        MI.sound.play('wrong');
        ctrl.reveal();
        card.classList.add('blitz-wrong');
        setTimeout(function () { if (running) next(); }, 700);
      }
    }
    function finish() {
      running = false;
      clearInterval(timer); timer = null;
      if (ctrl) { ctrl.destroy(); ctrl = null; }
      MI.keypad.close();
      MI.router.setGuard(null);
      var rec = MI.store.get('blitz', {});
      var isBest = right > (rec[uid] || 0);
      if (isBest) { rec[uid] = right; MI.store.set('blitz', rec); best = right; }
      MI.sound.play('finish');
      MI.showNewBadges(900);
      main.innerHTML = '';
      main.appendChild(h('section', { class: 'result' }, [
        h('div', { class: 'result-emoji', text: right >= 15 ? '🚀' : right >= 8 ? '🎉' : '💪' }),
        h('h2', { class: 'result-title', text: '时间到！' }),
        h('p', { class: 'result-score' }, ['答对 ', h('b', { text: right }), ' 道（一共做了 ' + total + ' 道）']),
        isBest && right ? h('p', { class: 'result-best', text: '🎊 新纪录！' }) : h('p', { class: 'muted', text: '最好成绩：' + best + ' 道' }),
        h('div', { class: 'result-actions' }, [
          h('button', { type: 'button', class: 'btn btn-primary btn-block', text: '再挑战一次', onclick: start }),
          h('a', { href: '#/unit/' + uid + '/practice', class: 'btn btn-block', text: '回到小岛' })
        ])
      ]));
    }

    intro();
    return function cleanup() {
      running = false; if (timer) clearInterval(timer); if (ctrl) ctrl.destroy(); MI.keypad.close();
      document.body.style.removeProperty('--theme'); document.body.style.removeProperty('--theme-deep');
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>/* js/pages/review.js */
/* 数学岛 · 错题本 + 每日一练
 * 错题本：自动收集做错的题（保存出题参数，能原样重现），按单元筛选，可以“重练错题”，连续答对 2 次自动移出。
 * 每日一练：每天 10 题，优先错题和正确率最低的知识点。 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  MI.pages = MI.pages || {};

  function wrongList(unitFilter) {
    var w = MI.progress.wrongBook();
    return Object.keys(w).map(function (id) { var it = w[id]; it.id = id; return it; })
      .filter(function (it) { return MI.units[it.unit] && (!unitFilter || it.unit === unitFilter); })
      .sort(function (a, b) { return (b.wrong - a.wrong) || (b.at - a.at); });
  }

  // ---------------- 错题本 ----------------
  MI.pages.wrong = function (app, filter) {
    var h = MI.ui.h;
    var all = wrongList(null), list = wrongList(filter || null);
    var page = h('div', { class: 'page page-plain' });
    page.appendChild(h('header', { class: 'plain-head' }, [h('h1', { text: '错题本' }), h('p', { class: 'muted', text: '做错的题会自动收进来。重练时连续答对 2 次，它就“毕业”离开错题本。' })]));
    // 按单元筛选
    var units = MI.ISLANDS.filter(function (i) { return all.some(function (it) { return it.unit === i.id; }); });
    if (units.length) {
      page.appendChild(h('div', { class: 'chips-row', role: 'tablist' }, [
        h('a', { href: '#/wrong', class: 'filter-chip' + (!filter ? ' on' : ''), text: '全部 ' + all.length })
      ].concat(units.map(function (i) {
        var n = all.filter(function (it) { return it.unit === i.id; }).length;
        return h('a', { href: '#/wrong/' + i.id, class: 'filter-chip' + (filter === i.id ? ' on' : ''), text: i.emoji + ' ' + i.title + ' ' + n });
      }))));
    }
    if (!list.length) {
      page.appendChild(h('section', { class: 'card soon' }, [h('div', { class: 'soon-emoji', text: '🌟' }), h('h2', { text: filter ? '这座岛没有错题' : '错题本是空的' }), h('p', { text: '太棒啦！去小岛上练一练吧。' })]));
    } else {
      page.appendChild(h('button', { type: 'button', class: 'btn btn-primary btn-block btn-lg', text: '重练错题（' + Math.min(list.length, 10) + ' 道）', onclick: function () { MI.router.go('#/review' + (filter ? '/' + filter : '')); } }));
      page.appendChild(h('ul', { class: 'wrong-list' }, list.map(function (it) {
        var isl = MI.island(it.unit);
        return h('li', { class: 'wrong-item' }, [
          h('div', { class: 'wrong-top' }, [
            h('span', { class: 'chip', style: { '--tl-l': MI.util.shade(isl.color, 0.85), '--tl-d': MI.util.shade(isl.color, -0.68) }, text: isl.emoji + ' ' + MI.skillName(it.unit, it.skill) }),
            h('span', { class: 'muted wrong-count', text: '错 ' + it.wrong + ' 次' + (it.streak ? ' · 已连对 ' + it.streak + ' 次' : '') })
          ]),
          h('p', { class: 'wrong-prompt', text: it.prompt }),
          h('a', { href: '#/review-one/' + encodeURIComponent(it.id), class: 'btn btn-small', text: '练这道' })
        ]);
      })));
    }
    page.appendChild(MI.pages.tabbar('#/wrong'));
    app.appendChild(page);
  };

  /** 重练错题（最多 10 道） */
  MI.pages.review = function (app, filter, oneId) {
    var list = wrongList(filter || null);
    if (oneId) list = list.filter(function (it) { return it.id === oneId; });
    if (!list.length) { MI.router.go('#/wrong'); return; }
    var items = list.slice(0, 10).map(function (it) { return { unit: it.ref.unit, gen: it.ref.gen, seed: it.ref.seed, d: it.ref.d }; });
    return MI.engine.run(app, { mode: 'review', unit: null, items: items, theme: '#7B68EE', exitHref: '#/wrong', again: true });
  };

  // ---------------- 每日一练 ----------------
  /** 今天的 10 道题：错题优先，再补正确率最低的知识点，还不够就从各岛随机抽 */
  MI.dailyPlan = function () {
    var today = MI.util.todayKey();
    var saved = MI.store.get('dailyPlan', null);
    if (saved && saved.date === today && saved.items && saved.items.length) return saved.items;
    var rng = MI.makeRng(MI.hashStr('daily#' + today));
    var items = [];
    wrongList(null).slice(0, 5).forEach(function (it) { items.push({ unit: it.ref.unit, gen: it.ref.gen, seed: it.ref.seed, d: it.ref.d }); });
    var st = MI.progress.stats().skills;
    var weak = Object.keys(st).map(function (k) { return { key: k, rate: st[k].c / Math.max(1, st[k].a), a: st[k].a }; })
      .filter(function (x) { var p = x.key.split('.'); return MI.units[p[0]] && x.rate < 0.85; })
      .sort(function (a, b) { return a.rate - b.rate; });
    weak.forEach(function (x) {
      if (items.length >= 8) return;
      var p = x.key.split('.'), d = x.rate < 0.5 ? 1 : 2;
      var gens = MI.generatorsFor(p[0], d).filter(function (g) { return g.skill === p[1]; });
      if (!gens.length) return;
      items.push({ unit: p[0], gen: rng.pick(gens).id, seed: Math.floor(rng.next() * 4294967296) >>> 0, d: d });
    });
    if (items.length < 10) {
      var ready = MI.ISLANDS.map(function (i) { return i.id; }).filter(function (id) { return MI.units[id] && !MI.units[id].mix; });
      var ds = []; for (var i = items.length; i < 10; i++) ds.push(rng.chance(0.6) ? 1 : 2);
      items = items.concat(MI.buildRound(ready, ds, rng));
    }
    items = items.slice(0, 10);
    MI.store.set('dailyPlan', { date: today, items: items });
    return items;
  };

  MI.pages.daily = function (app, go) {
    var h = MI.ui.h;
    var today = MI.util.todayKey();
    var done = MI.store.get('dailyDone', null);
    if (go === 'go') {
      return MI.engine.run(app, { mode: 'daily', unit: null, items: MI.dailyPlan(), theme: '#EE9B1C', exitHref: '#/daily' });
    }
    var plan = MI.dailyPlan();
    var nWrong = plan.filter(function (r) { return MI.progress.inWrongBook(r.unit + ':' + r.gen + ':' + r.d + ':' + r.seed); }).length;
    var page = h('div', { class: 'page page-plain' });
    page.appendChild(h('header', { class: 'plain-head' }, [h('h1', { text: '每日一练' }), h('p', { class: 'muted', text: today })]));
    var finished = done && done.date === today;
    page.appendChild(h('section', { class: 'card daily-card' }, [
      h('div', { class: 'soon-emoji', text: finished ? '🎉' : '☀️' }),
      h('h2', { text: finished ? '今天已经练完啦！' : '今天的 10 道题准备好了' }),
      finished ? h('p', { text: '一次答对 ' + done.correct + ' / ' + done.total + ' 题。明天再来，或者再练一遍也可以。' })
        : h('p', { text: (nWrong ? '里面有 ' + nWrong + ' 道是错题本里的题，' : '') + '其余是你还不太熟的知识点。不计时，慢慢做。' }),
      h('a', { href: '#/daily/go', class: 'btn btn-primary btn-block btn-lg', text: finished ? '再练一遍' : '开始今天的练习' })
    ]));
    // 最近 7 天
    var days = MI.store.get('days', {});
    var row = h('div', { class: 'week' });
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var k = MI.util.todayKey(d), on = !!days[k];
      row.appendChild(h('div', { class: 'day' + (on ? ' on' : '') }, [h('span', { class: 'day-dot', text: on ? '✔' : '' }), h('span', { class: 'day-name', text: '日一二三四五六'[d.getDay()] })]));
    }
    page.appendChild(h('section', { class: 'card' }, [h('h2', { class: 'card-title', text: '最近 7 天' }), row]));
    page.appendChild(MI.pages.tabbar('#/daily'));
    app.appendChild(page);
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>/* js/pages/parent.js */
/* 数学岛 · 奖励页（徽章墙）+ 家长页 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  MI.pages = MI.pages || {};

  // ---------------- 奖励页 ----------------
  MI.pages.badges = function (app) {
    var h = MI.ui.h;
    MI.badges.check();
    var got = MI.badges.got();
    var n = MI.badges.list.filter(function (b) { return got[b.id]; }).length;
    var page = h('div', { class: 'page page-plain' });
    page.appendChild(h('header', { class: 'plain-head' }, [h('h1', { text: '奖励' }), h('p', { class: 'muted', text: '已经得到 ' + n + ' / ' + MI.badges.list.length + ' 枚徽章' })]));
    page.appendChild(h('div', { class: 'badge-grid' }, MI.badges.list.map(function (b) {
      var p = b.progress(), on = !!got[b.id];
      var pct = Math.min(100, Math.round(p[0] / p[1] * 100));
      return h('div', { class: 'badge' + (on ? ' on' : '') }, [
        h('div', { class: 'badge-emoji', 'aria-hidden': 'true', text: b.emoji }),
        h('div', { class: 'badge-name', text: b.name }),
        h('div', { class: 'badge-desc', text: b.desc }),
        on ? h('div', { class: 'badge-date', text: '✔ ' + got[b.id] }) : h('div', { class: 'badge-bar' }, h('span', { style: { width: pct + '%' } })),
        on ? null : h('div', { class: 'badge-prog', text: Math.min(p[0], p[1]) + ' / ' + p[1] })
      ]);
    })));
    page.appendChild(MI.pages.tabbar('#/badges'));
    app.appendChild(page);
  };

  // ---------------- 家长页 ----------------
  var unlocked = false; // 本次打开页面期间解锁一次就行

  MI.pages.parent = function (app) {
    var h = MI.ui.h;
    var page = h('div', { class: 'page page-plain' });
    page.appendChild(h('header', { class: 'plain-head' }, [
      h('a', { href: '#/settings', class: 'icon-btn', 'aria-label': '返回设置', text: '←' }),
      h('h1', { text: '家长页' })
    ]));
    app.appendChild(page);
    if (!unlocked) return gate(page);
    content(page);
    page.appendChild(MI.pages.tabbar('#/settings'));
  };

  /** 门槛：一道三位数乘两位数的笔算题 */
  function gate(page) {
    var h = MI.ui.h;
    var a = 100 + Math.floor(Math.random() * 900), b = 11 + Math.floor(Math.random() * 89);
    var q = { type: 'fill', data: { template: a + ' × ' + b + ' = []' }, answer: String(a * b) };
    var box = h('div', { class: 'q-widget' });
    page.appendChild(h('section', { class: 'card' }, [
      h('h2', { class: 'card-title', text: '请家长算一算' }),
      h('p', { class: 'muted', text: '答对这道笔算题就能看到学习情况。' }),
      box
    ]));
    var ctrl = MI.types.fill(box, q, {
      submit: function () {
        var v = ctrl.value();
        if (v != null && MI.check(q, v)) { unlocked = true; MI.keypad.close(); MI.router.reload(); }
        else { MI.ui.toast('不对哦，再算一算'); }
      },
      changed: function () {}
    });
    return function () { ctrl.destroy(); };
  }

  function pct(c, a) { return a ? Math.round(c / a * 100) + '%' : '—'; }

  function content(page) {
    var h = MI.ui.h;
    var st = MI.progress.stats(), sk = st.skills || {};
    var total = st.total || { a: 0, c: 0 };
    var days = MI.store.get('days', {});
    var last7 = 0;
    for (var i = 0; i < 7; i++) { var d = new Date(); d.setDate(d.getDate() - i); if (days[MI.util.todayKey(d)]) last7++; }

    page.appendChild(h('section', { class: 'card stat-row' }, [
      stat('累计做题', total.a + ' 道'),
      stat('一次答对率', pct(total.c, total.a)),
      stat('最近 7 天学习', last7 + ' 天'),
      stat('最长连对', (st.bestStreak || 0) + ' 题')
    ]));

    // 各单元 / 知识点正确率
    var units = h('section', { class: 'card' }, [h('h2', { class: 'card-title', text: '各单元、知识点正确率（一次答对）' })]);
    MI.ISLANDS.forEach(function (isl) {
      var u = MI.units[isl.id];
      if (!u || u.mix) return;
      var ua = 0, uc = 0;
      var rows = u.skills.map(function (s) {
        var x = sk[isl.id + '.' + s.id] || { a: 0, c: 0 };
        ua += x.a; uc += x.c;
        return h('tr', {}, [h('td', { text: s.name }), h('td', { text: x.a }), h('td', { class: x.a && x.c / x.a < 0.6 ? 'low' : '', text: pct(x.c, x.a) })]);
      });
      var up = MI.progress.unit(isl.id);
      units.appendChild(h('details', { class: 'unit-stat' }, [
        h('summary', {}, [h('span', { text: isl.emoji + ' ' + isl.title }), h('span', { class: 'muted', text: ua + ' 题 · ' + pct(uc, ua) + ' · ' + '★'.repeat(up.bestStars) + '☆'.repeat(3 - up.bestStars) })]),
        h('table', { class: 'mi-table' }, [h('thead', {}, h('tr', {}, [h('th', { text: '知识点' }), h('th', { text: '做题' }), h('th', { text: '正确率' })])), h('tbody', {}, rows)])
      ]));
    });
    page.appendChild(units);

    // 高频错题
    var w = MI.progress.wrongBook();
    var top = Object.keys(w).map(function (id) { return w[id]; }).sort(function (a, b) { return b.wrong - a.wrong; }).slice(0, 10);
    page.appendChild(h('section', { class: 'card' }, [
      h('h2', { class: 'card-title', text: '高频错题（错题本里共 ' + Object.keys(w).length + ' 道）' }),
      top.length ? h('ol', { class: 'top-wrong' }, top.map(function (it) {
        var isl = MI.island(it.unit) || { emoji: '', title: '' };
        return h('li', {}, [h('b', { text: '错 ' + it.wrong + ' 次 ' }), h('span', { class: 'muted', text: isl.emoji + ' ' + MI.skillName(it.unit, it.skill) + '：' }), it.prompt]);
      })) : h('p', { class: 'muted', text: '还没有错题。' })
    ]));

    // 数据
    page.appendChild(h('section', { class: 'card' }, [
      h('h2', { class: 'card-title', text: '数据' }),
      h('p', { class: 'muted', text: '学习记录只存在这台设备的浏览器里。换设备前可以先导出备份。' }),
      h('div', { class: 'btn-col' }, [
        h('button', { type: 'button', class: 'btn btn-block', text: '📤 导出数据（JSON）', onclick: exportData }),
        h('button', { type: 'button', class: 'btn btn-block danger', text: '🗑️ 清空全部数据', onclick: clearAll })
      ])
    ]));
  }

  function stat(label, val) {
    var h = MI.ui.h;
    return h('div', { class: 'stat' }, [h('div', { class: 'stat-val', text: val }), h('div', { class: 'stat-label', text: label })]);
  }

  function dump() {
    var out = { app: '数学岛', version: MI.version, exportedAt: new Date().toISOString(), data: {} };
    MI.store.keys().forEach(function (k) { out.data[k] = MI.store.get(k, null); });
    return JSON.stringify(out, null, 2);
  }

  function exportData() {
    var json = dump();
    var name = 'math-island-' + MI.util.todayKey() + '.json';
    try {
      var blob = new Blob([json], { type: 'application/json' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1000);
    } catch (e) { /* 下面还会显示文本 */ }
    // 微信等浏览器可能不让下载，同时把内容显示出来，方便长按复制
    var ta = MI.ui.h('textarea', { class: 'export-text', readonly: true, rows: 8 });
    ta.value = json;
    MI.ui.modal({ emoji: '📤', title: '导出数据', body: MI.ui.h('div', {}, [MI.ui.h('p', { class: 'modal-body', text: '如果没有自动下载（比如在微信里），可以长按下面的文字全选复制保存。' }), ta]), buttons: [{ text: '好的', primary: true }] });
  }

  function clearAll() {
    MI.ui.confirm('清空全部数据？', '星星、错题本、徽章、做题记录都会被删除，不能恢复。', '清空', function () {
      MI.ui.confirm('真的要清空吗？', '再确认一次：删除后就找不回来了。', '确定清空', function () {
        MI.store.keys().forEach(function (k) { MI.store.remove(k); });
        try { sessionStorage.clear(); } catch (e) { /* 忽略 */ }
        unlocked = false;
        MI.ui.toast('已清空');
        MI.applySettings();
        MI.router.go('#/');
      }, '先不了');
    }, '先不了');
  }
})(typeof window !== 'undefined' ? window : globalThis);

</script>
  <script>/* js/main.js */
/* 数学岛 · 启动：注册页面、应用设置、休息提醒 */
(function (root) {
  'use strict';
  var MI = root.MathIsland;
  var R = MI.router, P = MI.pages;

  R.add(/^\/$/, P.map);
  R.add(/^\/unit\/(u\d)(?:\/(cards|practice|quiz))?$/, function (app, m) { return P.unit(app, m[0], m[1]); });
  R.add(/^\/play\/(u\d)\/(practice|quiz)(?:\/(\d))?$/, function (app, m) { return P.play(app, m[0], m[1], m[2]); });
  R.add(/^\/blitz\/(u\d)$/, function (app, m) { return P.blitz(app, m[0]); });
  R.add(/^\/settings$/, P.settings);
  R.add(/^\/daily(?:\/(go))?$/, function (app, m) { return P.daily(app, m[0]); });
  R.add(/^\/wrong(?:\/(u\d))?$/, function (app, m) { return P.wrong(app, m[0]); });
  R.add(/^\/review(?:\/(u\d))?$/, function (app, m) { return P.review(app, m[0]); });
  R.add(/^\/review-one\/(.+)$/, function (app, m) { return P.review(app, null, m[0]); });
  R.add(/^\/badges$/, P.badges);
  R.add(/^\/parent$/, P.parent);

  MI.applySettings();

  // iOS / 微信里音频要在第一次触摸时解锁
  document.addEventListener('pointerdown', function once() {
    MI.sound.unlock();
    document.removeEventListener('pointerdown', once);
  });

  // 连续使用 25 分钟，温和地提醒休息
  var REST_MS = 25 * 60 * 1000;
  var active = 0, last = Date.now();
  setInterval(function () {
    var now = Date.now();
    if (!document.hidden) active += Math.min(now - last, 60000);
    last = now;
    if (active >= REST_MS && !document.querySelector('.modal-mask')) {
      active = 0;
      MI.ui.modal({
        emoji: '🌿', title: '休息一下吧',
        body: '已经学了 25 分钟啦！站起来伸个懒腰，喝口水，看看远处，眼睛会很开心。',
        buttons: [{ text: '好的，休息一下', primary: true }]
      });
    }
  }, 15000);

  R.start();

  // PWA：在 http(s) 下注册 Service Worker（本地直接打开文件时跳过）。作用域是 sw.js 所在目录，适配 /仓库名/ 子路径
  if (!window.MathIslandSingleFile && 'serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      try { navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function () { /* 离线功能可有可无 */ }); } catch (e) { /* 忽略 */ }
    });
  }
})(window);

</script>

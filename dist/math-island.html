<!doctype html>
<html lang="zh-CN" data-font="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#FFF6E9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17162B" media="(prefers-color-scheme: dark)">
  <!-- 防止 iOS 把长数字识别成电话号码 -->
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="人教版（2026 秋）四年级上册数学复习闯关">
  <!-- 单文件离线版：由 scripts/bundle.js 生成，请不要手改 -->
  <title>数学岛 · 四年级上册复习</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%9D%EF%B8%8F%3C/text%3E%3C/svg%3E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="数学岛">
  <style>
/* 数学岛 · 样式
 * 颜色全部是 CSS 变量，跟随系统浅色/深色模式。以 375px 宽为基准，移动优先。 */

:root {
  --bg: #FFF6E9;
  --bg-deco: #FCE7CC;
  --surface: #FFFFFF;
  --surface-2: #FFF9F2;
  --ink: #2E2A4F;
  --ink-2: #625E82;
  --edge: #EADBC4;
  --edge-strong: #D9C6A8;
  --primary: #FF6B4A;
  --primary-deep: #D44A2B;
  --sea: #CDEFEA;
  --sea-2: #A7E2DA;
  --trail: #E7B77A;
  --ok: #1E9E66;
  --ok-bg: #E1F6EB;
  --oops: #C9761A;
  --oops-bg: #FFF1D9;
  --sun: #FFC53D;
  --sun-bg: #FFF4CC;
  --focus: #4F63FF;
  --shadow: 0 6px 18px rgba(74, 52, 20, .10);
  --theme: var(--primary);
  --theme-deep: var(--primary-deep);
  --tl-l: #FFE7DF;
  --tl-d: #3A2A35;
  --theme-light: var(--tl-l);
  --radius: 20px;
  --radius-sm: 14px;
  --font: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", sans-serif;
  --kp-h: 0px;
  --tabbar-h: 68px;
  color-scheme: light dark;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17162B;
    --bg-deco: #1F1D3A;
    --surface: #24223F;
    --surface-2: #2B2950;
    --ink: #F4F1FF;
    --ink-2: #B9B4DB;
    --edge: #3A375F;
    --edge-strong: #4A4775;
    --primary: #FF7E5F;
    --primary-deep: #B9472D;
    --sea: #15333C;
    --sea-2: #1C4651;
    --trail: #9C7A4E;
    --ok: #4FD39A;
    --ok-bg: #173A2D;
    --oops: #FFB45C;
    --oops-bg: #3D2D17;
    --sun: #FFD166;
    --sun-bg: #3B3218;
    --focus: #8D9BFF;
    --shadow: 0 6px 18px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #17162B;
  --bg-deco: #1F1D3A;
  --surface: #24223F;
  --surface-2: #2B2950;
  --ink: #F4F1FF;
  --ink-2: #B9B4DB;
  --edge: #3A375F;
  --edge-strong: #4A4775;
  --primary: #FF7E5F;
  --primary-deep: #B9472D;
  --sea: #15333C;
  --sea-2: #1C4651;
  --trail: #9C7A4E;
  --ok: #4FD39A;
  --ok-bg: #173A2D;
  --oops: #FFB45C;
  --oops-bg: #3D2D17;
  --sun: #FFD166;
  --sun-bg: #3B3218;
  --focus: #8D9BFF;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35);
  color-scheme: dark;
}
:root[data-theme="light"] { color-scheme: light; }

/* 主题浅色：浅色模式用很浅的主题色，深色模式用很深的主题色（由 JS 按岛屿颜色算好 --tl-l / --tl-d） */
.page { --theme-light: var(--tl-l); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .page { --theme-light: var(--tl-d); } }
:root[data-theme="dark"] .page { --theme-light: var(--tl-d); }

* { box-sizing: border-box; }
html { font-size: 18px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html[data-font="large"] { font-size: 21px; }
body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  line-height: 1.6;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
a { color: inherit; text-decoration: none; touch-action: manipulation; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { margin: 0; line-height: 1.3; }
p { margin: .4rem 0; }
[hidden] { display: none !important; }

.page { max-width: 560px; margin: 0 auto; padding: 0 16px calc(var(--tabbar-h) + 24px + env(safe-area-inset-bottom)); }
.muted { color: var(--ink-2); }
.center { text-align: center; }

/* ---------------- 按钮 ---------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .4em;
  min-height: 52px; padding: 0 20px;
  border-radius: 16px;
  border: 2px solid var(--edge-strong);
  background: var(--surface);
  box-shadow: 0 4px 0 var(--edge-strong);
  font-weight: 700; font-size: 1rem;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--edge-strong); }
.btn:disabled { opacity: .5; }
.btn-primary { background: var(--theme); border-color: var(--theme-deep); box-shadow: 0 4px 0 var(--theme-deep); color: #fff; }
.btn-primary:active { box-shadow: 0 1px 0 var(--theme-deep); }
.btn-ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-2); }
.btn-ghost:active { transform: none; box-shadow: none; background: var(--edge); }
.btn-small { min-height: 48px; padding: 0 14px; font-size: .9rem; border-radius: 12px; }
.btn-block { display: flex; width: 100%; }
.btn-lg { min-height: 60px; font-size: 1.1rem; margin-top: 12px; }
.icon-btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 48px; height: 48px; flex: none;
  border-radius: 14px; border: 2px solid var(--edge-strong); background: var(--surface);
  box-shadow: 0 3px 0 var(--edge-strong); font-size: 1.3rem; font-weight: 700; line-height: 1;
}
.icon-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge-strong); }
.icon-btn:disabled { opacity: .35; }

.card {
  background: var(--surface); border: 2px solid var(--edge); border-radius: var(--radius);
  padding: 18px 16px; margin: 14px 0; box-shadow: var(--shadow);
}
.card-title { font-size: 1.1rem; margin-bottom: 4px; }
.chip {
  display: inline-flex; align-items: center; min-height: 28px; padding: 0 10px;
  border-radius: 999px; background: var(--theme-light); color: var(--ink);
  font-size: .8rem; font-weight: 700;
}
.chip-soft { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--edge); }
.chip-sun { background: var(--sun-bg); }

.stars { display: inline-flex; gap: 1px; letter-spacing: 0; }
.star { color: var(--edge-strong); font-size: 1.05em; line-height: 1; }
.star.on { color: var(--sun); text-shadow: 0 1px 0 rgba(160, 100, 0, .25); }

/* ---------------- 首页地图 ---------------- */
.map-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 0 4px; gap: 12px; }
.map-title { font-size: 1.9rem; font-weight: 900; letter-spacing: 2px; }
.map-title::before { content: "🏝️ "; }
.map-sub { margin: 0; color: var(--ink-2); font-size: .9rem; }
.star-total {
  flex: none; padding: 8px 14px; border-radius: 999px; background: var(--surface);
  border: 2px solid var(--edge); font-weight: 800; white-space: nowrap;
}
.map-greet { color: var(--ink-2); margin: 6px 0 4px; }
.map {
  position: relative; margin: 8px -16px 0;
  background:
    radial-gradient(circle at 20% 12%, var(--sea-2) 0 2px, transparent 3px) 0 0 / 46px 46px,
    linear-gradient(180deg, var(--sea), var(--bg-deco));
  border-radius: 28px 28px 0 0;
  overflow: hidden;
}
.map-path { position: absolute; inset: 0; width: 100%; height: 100%; }
.map-trail { fill: none; stroke: var(--trail); stroke-width: 5; stroke-dasharray: 2 12; stroke-linecap: round; }
.map-deco { position: absolute; font-size: 1.6rem; opacity: .75; pointer-events: none; }
.island {
  position: absolute; width: 46%;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  padding: 6px 4px; border-radius: 22px; text-align: center;
}
.island:active .isle-blob { transform: translateY(3px) scale(.98); box-shadow: 0 2px 0 var(--cd); }
.isle-blob {
  position: relative; width: 78px; height: 66px;
  display: flex; align-items: center; justify-content: center;
  background: var(--c); border: 3px solid var(--cd);
  border-radius: 52% 48% 46% 54% / 58% 54% 46% 42%;
  box-shadow: 0 6px 0 var(--cd), 0 10px 18px rgba(0, 0, 0, .12);
  transition: transform .12s;
}
.isle-emoji { font-size: 2rem; line-height: 1; filter: drop-shadow(0 2px 0 rgba(0, 0, 0, .15)); }
.isle-no {
  position: absolute; top: -10px; left: -8px; width: 30px; height: 30px; border-radius: 50%;
  background: var(--surface); border: 2px solid var(--cd); color: var(--cd);
  font-weight: 900; font-size: .85rem; display: flex; align-items: center; justify-content: center;
}
.isle-name {
  margin-top: 8px; font-weight: 800; font-size: .95rem; line-height: 1.25;
  background: var(--surface); padding: 3px 10px; border-radius: 10px; border: 2px solid var(--edge);
  max-width: 100%;
}
.isle-info { display: flex; align-items: center; gap: 6px; font-size: .85rem; }
.isle-pct { font-weight: 800; color: var(--ink-2); }
.isle-soon { color: var(--ink-2); font-size: .8rem; }
.island.building .isle-blob { filter: saturate(.55); }

/* ---------------- 底部导航 ---------------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: space-around;
  background: var(--surface); border-top: 2px solid var(--edge);
  padding: 4px max(4px, env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(4px, env(safe-area-inset-left));
}
.tab { flex: 1; max-width: 110px; min-height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 14px; color: var(--ink-2); }
.tab-icon { font-size: 1.35rem; line-height: 1.1; }
.tab-text { font-size: .72rem; font-weight: 700; }
.tab.on { color: var(--ink); background: var(--bg); }

/* ---------------- 单元页 ---------------- */
.unit-head { display: flex; align-items: center; gap: 10px; padding: 14px 0 8px; }
.unit-title-wrap { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
.unit-emoji {
  flex: none; width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
  background: var(--theme); border: 2px solid var(--theme-deep); font-size: 1.4rem;
}
.unit-title { font-size: 1.25rem; font-weight: 900; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unit-no { flex: none; font-size: .8rem; font-weight: 800; color: var(--theme-deep); background: var(--theme-light); padding: 4px 10px; border-radius: 999px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .unit-no { color: var(--ink); } }
:root[data-theme="dark"] .unit-no { color: var(--ink); }

.seg { display: flex; gap: 6px; padding: 5px; background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; margin: 6px 0 4px; }
.seg-btn { flex: 1; min-height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 13px; font-weight: 800; font-size: .95rem; color: var(--ink-2); border: 0; background: transparent; white-space: nowrap; }
.seg-btn.on { background: var(--theme); color: #fff; box-shadow: 0 3px 0 var(--theme-deep); }
.seg-inline { margin: 0; flex: none; min-width: 140px; }
.seg-inline .seg-btn { min-width: 60px; }

/* 知识卡 */
.cards-count { text-align: center; color: var(--ink-2); font-weight: 700; margin: 12px 0 6px; }
.cards-viewport { overflow: hidden; margin: 0 -16px; padding: 4px 8px 10px; touch-action: pan-y; }
.cards-track { display: flex; transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
.cards-track.dragging { transition: none; }
.kslide { flex: 0 0 100%; min-width: 0; padding: 0 8px; display: flex; }
.kcard {
  flex: 1 1 auto; min-width: 0; padding: 18px 16px 16px;
  background: var(--surface); border: 2px solid var(--edge); border-radius: 24px;
  box-shadow: 0 5px 0 var(--edge-strong);
  display: flex; flex-direction: column;
}
.kcard.known { border-color: var(--ok); box-shadow: 0 5px 0 var(--ok); }
.kcard-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.kcard-emoji { font-size: 1.8rem; }
.kcard-title { font-size: 1.25rem; font-weight: 900; }
.kcard-label { font-size: .85rem; color: var(--theme-deep); margin-top: 10px; letter-spacing: 1px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kcard-label { color: var(--theme); } }
:root[data-theme="dark"] .kcard-label { color: var(--theme); }
.kcard ul { margin: 4px 0; padding-left: 1.2em; }
.kcard li { margin: 4px 0; }
.kcard-examples li { font-variant-numeric: tabular-nums; }
.kcard-pitfall { margin-top: 12px; padding: 10px 12px; border-radius: 14px; background: var(--oops-bg); }
.know-btn { margin-top: 14px; width: 100%; }
.know-btn.on { background: var(--ok-bg); border-color: var(--ok); box-shadow: 0 4px 0 var(--ok); color: var(--ok); }
.cards-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; }
.dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; flex: 1; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--edge-strong); }
.dot.done { background: var(--ok); }
.dot.on { background: var(--theme); transform: scale(1.35); }

/* 练一练 / 测验 */
.diff-pick { display: grid; gap: 10px; margin: 14px 0 4px; }
.diff {
  display: flex; flex-direction: column; align-items: flex-start; text-align: left;
  min-height: 64px; padding: 10px 14px; border-radius: 16px;
  border: 2px solid var(--edge-strong); background: var(--surface-2); box-shadow: 0 3px 0 var(--edge-strong);
}
.diff.on { border-color: var(--theme); background: var(--theme-light); box-shadow: 0 3px 0 var(--theme-deep); }
.diff-name { font-weight: 900; }
.diff-desc { font-size: .9rem; color: var(--ink-2); }
.skill-list { list-style: none; margin: 8px 0 0; padding: 0; }
.skill { display: grid; grid-template-columns: 1fr 70px 46px; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--edge); }
.skill:last-child { border-bottom: 0; }
.skill-name { font-size: .95rem; }
.skill-bar { height: 10px; border-radius: 6px; background: var(--edge); overflow: hidden; }
.skill-fill { display: block; height: 100%; background: var(--theme); border-radius: 6px; }
.skill-pct { font-size: .85rem; color: var(--ink-2); text-align: right; font-weight: 700; }
.quiz-best { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
.quiz-best .stars { font-size: 1.6rem; }
.rules { list-style: none; padding: 0; margin: 10px 0; }
.rules li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--edge); }
.soon { text-align: center; }
.soon-emoji { font-size: 3rem; }
.soon h2 { margin: 6px 0; }
.soon .btn { margin-top: 12px; }

/* ---------------- 做题页 ---------------- */
.play { padding-bottom: 24px; }
.play-top {
  position: sticky; top: 0; z-index: 15;
  display: flex; align-items: center; gap: 10px;
  margin: 0 -16px; padding: 10px 16px; background: var(--bg);
}
.progress { flex: 1; height: 14px; border-radius: 8px; background: var(--edge); overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--theme); border-radius: 8px; transition: width .25s; }
.play-count { font-weight: 800; font-size: .9rem; color: var(--ink-2); min-width: 40px; text-align: right; }
.streak { font-weight: 900; min-width: 34px; color: var(--oops); }
.play-main { padding-bottom: 20px; }
body.has-keypad .play-main { padding-bottom: calc(var(--kp-h) + 20px); }
.play.sheet-open .play-main { padding-bottom: calc(var(--kp-h) + 240px); }
.q-card {
  background: var(--surface); border: 2px solid var(--edge); border-radius: 24px;
  padding: 14px 16px 18px; box-shadow: 0 5px 0 var(--edge-strong); margin-top: 6px;
}
.q-card.pop { animation: pop .3s ease; }
.q-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-bottom: 8px; }
.hint-btn {
  margin-left: auto; min-height: 40px; padding: 0 12px; border-radius: 12px;
  border: 2px solid var(--edge); background: var(--sun-bg); font-weight: 800; font-size: .9rem;
}
.q-meta .hint-btn { position: relative; }
.q-meta .hint-btn::before { content: ""; position: absolute; inset: -6px; }
.q-prompt { font-size: 1.12rem; font-weight: 700; margin: 4px 0 8px; white-space: pre-line; }
.bignum {
  margin: 10px 0 12px; padding: 12px 10px; border-radius: 16px; text-align: center;
  background: var(--surface-2); border: 2px dashed var(--edge-strong);
  font-size: 1.75rem; font-weight: 900; letter-spacing: 1px; font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.bignum.long { font-size: 1.35rem; letter-spacing: 0; }
.q-widget { margin-top: 8px; }
.widget-tip { color: var(--ink-2); font-size: .92rem; margin: 8px 0; }
.widget-tip.warn { color: var(--oops); font-weight: 700; }
.play-foot { position: sticky; bottom: 0; padding: 12px 0 calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 10; }

/* 选择题 */
.choices { display: grid; gap: 10px; }
.choices-big { grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); }
.choice {
  display: flex; align-items: center; gap: 10px; text-align: left;
  min-height: 56px; padding: 10px 14px; border-radius: 16px;
  border: 2px solid var(--edge-strong); background: var(--surface-2); box-shadow: 0 3px 0 var(--edge-strong);
  font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
.choices-big .choice { justify-content: center; font-size: 1.7rem; min-height: 68px; }
.choice-tag {
  flex: none; width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
  background: var(--edge); font-size: .85rem; font-weight: 900;
}
.choice.sel { border-color: var(--theme); background: var(--theme-light); box-shadow: 0 3px 0 var(--theme-deep); }
.choice.sel .choice-tag { background: var(--theme); color: #fff; }
.choice.tried { opacity: .45; text-decoration: line-through; box-shadow: none; }
.choice.correct { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 3px 0 var(--ok); opacity: 1; text-decoration: none; }
.choice.correct .choice-tag { background: var(--ok); color: #fff; }
.choices-judge { grid-template-columns: 1fr 1fr; }
.choices-judge .choice { flex-direction: column; justify-content: center; gap: 0; min-height: 84px; font-size: 1.2rem; }
.judge-mark { font-size: 1.7rem; line-height: 1.1; }
.judge-yes .judge-mark { color: var(--ok); }
.judge-no .judge-mark { color: var(--oops); }

/* 多选 */
.multi-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.multi-btn {
  min-height: 56px; border-radius: 14px; border: 2px solid var(--edge-strong); background: var(--surface-2);
  box-shadow: 0 3px 0 var(--edge-strong); font-size: 1.4rem; font-weight: 900;
}
.multi-btn.sel { background: var(--theme); border-color: var(--theme-deep); color: #fff; box-shadow: 0 3px 0 var(--theme-deep); }
.multi-btn.correct { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); box-shadow: 0 3px 0 var(--ok); }
.multi-btn.miss { opacity: .45; text-decoration: line-through; }

/* 填空 */
.fill-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 4px; font-size: 1.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.fill-text { white-space: pre-wrap; overflow-wrap: anywhere; }
.fill-br { flex-basis: 100%; height: 0; }
.blank {
  min-width: 72px; min-height: 52px; padding: 0 10px; border-radius: 12px;
  border: 2px dashed var(--edge-strong); background: var(--surface-2);
  font-size: 1.35rem; font-weight: 900; letter-spacing: .5px; font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere; max-width: 100%;
}
.fill-solo .blank { width: 100%; }
.blank.active { border-style: solid; border-color: var(--theme); background: var(--theme-light); }
.blank.active.empty::after, .blank.active:not(.empty)::after {
  content: ""; display: inline-block; width: 2px; height: 1.1em; margin-left: 2px; vertical-align: -0.15em;
  background: var(--theme); animation: blink 1s steps(2) infinite;
}
.blank.wrong { border-color: var(--oops); background: var(--oops-bg); }
.blank.revealed { border-style: solid; border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }

/* 数字小键盘 */
.keypad {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  background: var(--bg-deco); border-top: 2px solid var(--edge-strong);
  padding: 8px max(10px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
}
.kp-extras, .kp-grid { max-width: 520px; margin: 0 auto; }
.kp-extras { display: flex; gap: 8px; margin-bottom: 8px; }
.kp-extras .kp-key { flex: 1; }
.kp-grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-auto-rows: 52px; gap: 8px; grid-template-areas: "k1 k2 k3 del" "k4 k5 k6 ok" "k7 k8 k9 ok" "clr k0 k0 ok"; }
.kp-key {
  min-height: 52px; border-radius: 13px; border: 0; background: var(--surface);
  box-shadow: 0 3px 0 var(--edge-strong); font-size: 1.45rem; font-weight: 800;
}
.kp-key.pressed { transform: translateY(2px); box-shadow: 0 1px 0 var(--edge-strong); }
.kp-grid .kp-key:nth-child(1) { grid-area: k1; } .kp-grid .kp-key:nth-child(2) { grid-area: k2; } .kp-grid .kp-key:nth-child(3) { grid-area: k3; }
.kp-grid .kp-key:nth-child(5) { grid-area: k4; } .kp-grid .kp-key:nth-child(6) { grid-area: k5; } .kp-grid .kp-key:nth-child(7) { grid-area: k6; }
.kp-grid .kp-key:nth-child(9) { grid-area: k7; } .kp-grid .kp-key:nth-child(10) { grid-area: k8; } .kp-grid .kp-key:nth-child(11) { grid-area: k9; }
.kp-del { grid-area: del; font-size: 1.2rem; }
.kp-ok { grid-area: ok; background: var(--theme); color: #fff; box-shadow: 0 3px 0 var(--theme-deep); font-size: 1.1rem; }
.kp-clear { grid-area: clr; font-size: 1rem; color: var(--ink-2); }
.kp-zero { grid-area: k0; }
.kp-sym { background: var(--sun-bg); font-size: 1.35rem; }

/* 点选拼读 */
.read-line {
  min-height: 64px; padding: 10px; border-radius: 16px; border: 2px dashed var(--edge-strong); background: var(--surface-2);
  display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 1.25rem; font-weight: 800;
}
.read-line.wrong { border-color: var(--oops); background: var(--oops-bg); }
.read-line.revealed { border-style: solid; border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.read-ph { color: var(--ink-2); font-size: .9rem; font-weight: 600; }
.read-chip { padding: 2px 6px; border-radius: 8px; background: var(--theme-light); animation: pop .2s ease; }
.read-tools { display: flex; gap: 8px; justify-content: flex-end; margin: 8px 0; }
.tile-pool { display: flex; flex-wrap: wrap; gap: 8px; }
.tile {
  min-width: 56px; min-height: 52px; padding: 0 12px; border-radius: 14px;
  border: 2px solid var(--edge-strong); background: var(--surface); box-shadow: 0 3px 0 var(--edge-strong);
  font-size: 1.25rem; font-weight: 800;
}
.tile.used { visibility: hidden; }

/* 数位顺序表 */
.pv { display: grid; gap: 8px; }
.pv-level { border: 2px solid var(--edge); border-radius: 16px; padding: 6px 6px 8px; background: var(--surface-2); }
.pv-label { font-size: .82rem; font-weight: 800; color: var(--ink-2); text-align: center; margin-bottom: 2px; }
.pv-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pv-cell { display: flex; flex-direction: column; align-items: stretch; }
.pv-name { font-size: .78rem; text-align: center; color: var(--ink-2); white-space: nowrap; }
.pv-slot {
  min-height: 54px; border-radius: 12px; border: 2px dashed var(--edge-strong); background: var(--surface);
  font-size: 1.6rem; font-weight: 900;
}
.pv-slot.filled { border-style: solid; border-color: var(--theme); background: var(--theme-light); }
.pv-slot.drop-over { border-color: var(--focus); background: var(--sun-bg); transform: scale(1.05); }
.pv-slot.wrong { border-color: var(--oops); background: var(--oops-bg); }
.pv-slot.revealed { border-color: var(--ok); background: var(--ok-bg); }
.pv-cards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.pv-card {
  min-height: 56px; border-radius: 14px; border: 2px solid var(--theme-deep); background: var(--theme); color: #fff;
  box-shadow: 0 3px 0 var(--theme-deep); font-size: 1.5rem; font-weight: 900;
}
.pv-card.sel { outline: 4px solid var(--sun); outline-offset: 1px; transform: translateY(-2px); }
.pv-card.dragging { opacity: .4; }
.drag-ghost {
  position: fixed; left: 0; top: 0; z-index: 50; width: 56px; height: 64px; pointer-events: none;
  display: flex; align-items: center; justify-content: center; opacity: .92; box-shadow: 0 10px 20px rgba(0, 0, 0, .25);
}

/* 一排大数字：分级线、四舍五入 */
.digit-row {
  display: flex; justify-content: center; align-items: stretch; flex-wrap: nowrap;
  padding: 10px 2px; border-radius: 16px; background: var(--surface-2); border: 2px solid var(--edge);
  font-variant-numeric: tabular-nums; margin: 0 -6px;
}
.dg {
  flex: 0 1 34px; min-width: 0; height: 64px; display: flex; align-items: center; justify-content: center;
  font-size: 1.9rem; font-weight: 900;
}
.digit-row.tight .dg { font-size: 1.55rem; }
.gap { position: relative; flex: 0 0 10px; height: 64px; padding: 0; border: 0; background: transparent; }
.gap::before { content: ""; position: absolute; top: -4px; bottom: -4px; left: -14px; right: -14px; }
.gap::after { content: ""; position: absolute; bottom: 8px; left: 3px; width: 4px; height: 4px; border-radius: 2px; background: var(--edge-strong); }
.gap.on::after { background: var(--theme); top: 2px; bottom: 2px; height: auto; }
.gap.wrong::after { background: var(--oops); }
.gap.revealed.on::after { background: var(--ok); }
.dg-btn { border: 0; background: transparent; border-radius: 10px; padding: 0; }
.dg-btn.unit-place { text-decoration: underline; text-decoration-thickness: 3px; text-underline-offset: 6px; text-decoration-color: var(--theme); }
.dg-btn.look { background: var(--sun); color: #3a2a00; }
.dg-btn.tail { opacity: .35; }
.dg-btn:disabled { color: inherit; }
.dg-btn.shake { animation: shake .3s; }
.round-legend { font-size: .85rem; color: var(--ink-2); margin-bottom: 4px; }
.round-tip { min-height: 1.6em; }
.round-fill { margin-top: 8px; }

/* 算盘 */
.abacus-wrap { display: flex; justify-content: center; margin: 4px 0 12px; }
.abacus { width: 100%; max-width: 340px; height: auto; }
.ab-frame { fill: var(--surface-2); stroke: #9A6B3E; stroke-width: 6; }
.ab-rod { stroke: #B9895A; stroke-width: 3; }
.ab-beam { fill: #9A6B3E; }
.ab-bead { fill: var(--edge); stroke: var(--edge-strong); stroke-width: 2; }
.ab-bead.on { fill: var(--theme); stroke: var(--theme-deep); }
.ab-label { fill: var(--ink-2); font-size: 14px; font-weight: 700; }

/* 竖式乘法网格 */
.vm-wrap { display: flex; justify-content: center; padding: 6px 0 2px; }
.vm { display: inline-grid; gap: 0; font-variant-numeric: tabular-nums; }
.vm-row { display: grid; grid-template-columns: repeat(var(--w), 46px); gap: 4px; justify-content: end; }
.vm-fixed { height: 42px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 900; }
.vm-sign { color: var(--theme); }
.vm-line { height: 3px; background: var(--ink); border-radius: 2px; margin: 4px 0 2px; }
.vm-carry-row { margin-top: 2px; }
.vm-carry {
  height: 22px; padding: 0; border: 1px dashed var(--edge-strong); border-radius: 7px; background: transparent;
  font-size: .8rem; font-weight: 800; color: var(--oops); width: 26px; justify-self: start; margin-left: -2px;
}
.vm-carry.active { border-style: solid; border-color: var(--theme); background: var(--theme-light); }
.vm-cell {
  height: 48px; padding: 0; border-radius: 10px; border: 2px dashed var(--edge-strong); background: var(--surface-2);
  font-size: 1.55rem; font-weight: 900;
}
.vm-cell.active { border-style: solid; border-color: var(--theme); background: var(--theme-light); }
.vm-cell.wrong { border-style: solid; border-color: var(--oops); background: var(--oops-bg); animation: shake .3s; }
.vm-input-row.ok .vm-cell { border-color: var(--ok); }
.vm-input-row.ok .vm-cell:not(:empty) { background: var(--ok-bg); color: var(--ok); border-style: solid; }
.vm-tools { display: flex; align-items: center; gap: 10px; margin: 0 0 4px; }
.vm-tip { flex: 1; margin: 0; }
.vm-check { flex: none; }
@media (max-width: 360px) { .vm-row { grid-template-columns: repeat(var(--w), 40px); } }

/* 线段图、时间轴、对比表 */
.diagram-wrap { margin: 6px 0 10px; padding: 6px 4px; border-radius: 16px; background: var(--surface-2); border: 2px solid var(--edge); }
.diagram { display: block; width: 100%; height: auto; }
.dg-text { fill: var(--ink); font-size: 15px; font-weight: 700; font-family: var(--font); }
.dg-name { fill: var(--ink-2); }
.dg-small { fill: var(--ink-2); font-size: 12px; }
.dg-ask { fill: var(--theme-deep); font-weight: 900; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .dg-ask { fill: var(--sun); } }
:root[data-theme="dark"] .dg-ask { fill: var(--sun); }
.dg-seg line { stroke: var(--theme); stroke-width: 4; stroke-linecap: round; }
.dg-seg.c1 line { stroke: var(--focus); }
.dg-seg.c2 line { stroke: var(--ok); }
.dg-seg.dg-gap line:first-child { stroke-dasharray: 2 6; }
.dg-dots { fill: var(--ink-2); }
.dg-brace { fill: none; stroke: var(--ink-2); stroke-width: 2; }
.dg-dash { stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 4; }
.dg-axis { stroke: var(--ink-2); stroke-width: 2; }
.dg-dot { fill: var(--theme); stroke: var(--surface); stroke-width: 2; }
.dg-arrow { stroke: var(--theme); stroke-width: 3; stroke-dasharray: 6 4; }
.mi-table-wrap { margin: 6px 0 10px; }
.mi-table { width: 100%; border-collapse: separate; border-spacing: 0; border: 2px solid var(--edge); border-radius: 14px; overflow: hidden; font-size: .95rem; }
.mi-table th, .mi-table td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--edge); }
.mi-table tr:last-child th, .mi-table tr:last-child td { border-bottom: 0; }
.mi-table thead th { background: var(--theme-light); }
.mi-table tbody th { color: var(--ink-2); font-weight: 700; text-align: left; white-space: nowrap; }
.mi-table td.ask { color: var(--theme); font-weight: 900; font-size: 1.1rem; }

/* 练一练页的额外入口、口算挑战 */
.extra-card { display: flex; align-items: center; gap: 12px; }
.extra-icon { font-size: 2rem; }
.extra-text { flex: 1; display: flex; flex-direction: column; }
.blitz-timer { font-weight: 900; font-size: 1.2rem; min-width: 46px; text-align: right; }
.blitz-timer.hurry { color: var(--oops); }
.blitz-score { font-weight: 900; color: var(--ok); min-width: 46px; }
.blitz-card .fill-line { justify-content: center; font-size: 1.8rem; padding: 18px 0; }
.blitz-card .blank { font-size: 1.8rem; min-width: 110px; }
.blitz-card.blitz-wrong { border-color: var(--oops); }

/* 几何图形（量角器、钟面、三角尺、方格纸） */
.figure-wrap { margin: 6px 0 10px; padding: 6px; border-radius: 16px; background: var(--surface-2); border: 2px solid var(--edge); display: flex; justify-content: center; }
.figure { display: block; width: 100%; height: auto; max-height: 46vh; }
.figure.fig-small { max-width: 200px; }
.g-text { fill: var(--ink); font-family: var(--font); font-weight: 700; font-size: 14px; }
.g-label { fill: var(--ink); font-size: 15px; }
.g-small { fill: var(--ink-2); font-size: 12px; }
.g-name { fill: var(--ink); font-size: 16px; font-style: italic; font-weight: 800; }
.g-ask { fill: var(--theme); font-size: 18px; font-weight: 900; }
.g-line { stroke: var(--ink); stroke-width: 2; }
.g-ray { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.g-ray.c1 { stroke: var(--focus); }
.g-ray.thick, .g-arc.thick { stroke-width: 4.5; }
.g-ray.free { stroke: var(--theme); }
.g-ray.answer { stroke: var(--ok); stroke-dasharray: 8 5; }
.g-arc { fill: none; stroke: var(--theme); stroke-width: 2.5; }
.g-arc.b { stroke: var(--focus); }
.g-right { fill: none; stroke: var(--ink); stroke-width: 2; }
.g-grid { stroke: var(--edge); stroke-width: 1; }
.g-point { fill: var(--theme); stroke: var(--surface); stroke-width: 2; }
.g-poly { fill: var(--theme-light); stroke: var(--ink); stroke-width: 3; stroke-linejoin: round; }
.pr-body { fill: rgba(255, 197, 61, .16); stroke: var(--ink-2); stroke-width: 1.5; }
.pr-inner { fill: none; stroke: var(--edge-strong); stroke-width: 1; }
.pr-tick { stroke: var(--ink-2); stroke-width: .8; }
.pr-tick.big { stroke: var(--ink); stroke-width: 1.4; }
.pr-out { fill: var(--ink); font-size: 10px; font-weight: 800; }
.pr-in { fill: #C2410C; font-size: 9px; font-weight: 800; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pr-in { fill: #FDBA74; } }
:root[data-theme="dark"] .pr-in { fill: #FDBA74; }
.pr-base { stroke: var(--ink-2); stroke-width: 1.5; }
.pr-center { fill: var(--ink); }
.knob { fill: var(--theme); fill-opacity: .85; stroke: var(--surface); stroke-width: 3; cursor: grab; }
.draw-angle { touch-action: none; }
.nudge { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.nudge .muted { font-size: .85rem; text-align: center; }
.ck-face { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }
.ck-tick { stroke: var(--ink-2); stroke-width: 1; }
.ck-tick.big { stroke: var(--ink); stroke-width: 2.5; }
.ck-num { fill: var(--ink); font-size: 14px; font-weight: 800; }
.ck-hour { stroke: var(--ink); stroke-width: 6; stroke-linecap: round; }
.ck-min { stroke: var(--theme); stroke-width: 4; stroke-linecap: round; }
.tri { stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; }
.tri-a { fill: rgba(58, 142, 230, .28); }
.tri-b { fill: rgba(255, 197, 61, .35); }

/* 拖进筐里分类 */
.sort-pool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 92px; padding: 8px; border-radius: 16px; border: 2px dashed var(--edge-strong); }
.sort-pool.empty::after { content: "都放好啦，检查一下点“确定”"; color: var(--ink-2); font-size: .9rem; align-self: center; }
.sort-item { width: 78px; height: 78px; padding: 2px; border-radius: 14px; border: 2px solid var(--edge-strong); background: var(--surface); box-shadow: 0 3px 0 var(--edge-strong); }
.sort-item .thumb { width: 100%; height: 100%; display: block; pointer-events: none; }
.sort-item.sel { outline: 4px solid var(--sun); transform: translateY(-2px); }
.sort-item.wrong { border-color: var(--oops); background: var(--oops-bg); }
.sort-item.revealed { border-color: var(--ok); }
.sort-item.dragging { opacity: .4; }
.drag-ghost.sort-item { width: 78px; height: 78px; }
.sort-bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.sort-bins.many { grid-template-columns: repeat(2, 1fr); }
.sort-bin {
  display: flex; flex-direction: column; align-items: stretch; gap: 4px; min-height: 104px; padding: 6px;
  border-radius: 16px; border: 2px solid var(--theme); background: var(--theme-light); text-align: center;
}
.sort-bin.drop-over { background: var(--sun-bg); border-color: var(--focus); }
.sort-name { font-weight: 900; font-size: .95rem; }
.sort-drop { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.sort-drop .sort-item { width: 56px; height: 56px; box-shadow: none; }

/* 在图上点一条线 */
.pick-seg { cursor: pointer; outline: none; }
.pick-hit { stroke: transparent; stroke-width: 26; stroke-linecap: round; }
.pick-line { stroke: var(--ink); stroke-width: 4; stroke-linecap: round; }
.pick-seg:focus-visible .pick-line { stroke: var(--focus); }
.pick-seg.sel .pick-line { stroke: var(--theme); stroke-width: 7; }
.pick-seg.tried .pick-line { stroke: var(--edge-strong); stroke-dasharray: 6 6; }
.pick-seg.correct .pick-line { stroke: var(--ok); stroke-width: 7; }

/* 条形统计图 */
.chart { max-height: 52vh; }
.c-text { fill: var(--ink); font-family: var(--font); font-size: 12px; font-weight: 700; }
.c-title { font-size: 14px; font-weight: 900; }
.c-tick, .c-small { fill: var(--ink-2); font-size: 11px; }
.c-cat { font-size: 12px; }
.c-legend { font-size: 12px; }
.c-val { fill: var(--ink); font-size: 11px; font-weight: 800; }
.c-grid { stroke: var(--edge); stroke-width: 1; }
.c-axis { stroke: var(--ink-2); stroke-width: 1.5; }
.c-bar.s0 { fill: var(--theme); }
.c-bar.s1 { fill: var(--focus); }
.c-bar.missing { fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-dasharray: 4 3; }
.c-bar.filled { fill: var(--sun); stroke: var(--oops); stroke-width: 1.5; }
.c-bar.active { stroke: var(--focus); stroke-width: 2.5; }
.bf-list { display: grid; gap: 8px; }
.bf-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 14px; border: 2px solid var(--edge); background: var(--surface-2); }
.bf-row.on { border-color: var(--theme); background: var(--theme-light); }
.bf-name { flex: 1; font-weight: 800; }
.bf-val { min-width: 48px; text-align: center; font-size: 1.2rem; font-variant-numeric: tabular-nums; }

/* 藏宝图 */
.tmap { max-height: 46vh; }
.tm-bg { fill: #EAF7E4; stroke: #9BC48A; stroke-width: 2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tm-bg { fill: #1E3528; stroke: #3F6B4C; } }
:root[data-theme="dark"] .tm-bg { fill: #1E3528; stroke: #3F6B4C; }
.tm-grid { stroke: #B9DAAB; stroke-width: 1; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tm-grid { stroke: #34563F; } }
:root[data-theme="dark"] .tm-grid { stroke: #34563F; }
.tm-emoji { font-size: 28px; }
.tm-flag { font-size: 20px; opacity: .8; }
.tm-route { fill: none; stroke: var(--theme); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 2 9; }
.tm-route.walk { stroke-dasharray: none; stroke-opacity: .55; }
.tm-route.answer { stroke: var(--ok); stroke-dasharray: 8 6; stroke-opacity: 1; }
.tm-compass-bg { fill: var(--surface); stroke: var(--ink-2); stroke-width: 1.5; }
.tm-needle { fill: #E5484D; }
.tm-n { fill: var(--ink); font-size: 9px; font-weight: 900; }
.dpad { display: grid; grid-template-columns: repeat(3, 76px); grid-auto-rows: 60px; gap: 8px; justify-content: center; margin-top: 6px; }
.dpad-btn { flex-direction: column; gap: 0; padding: 0; min-height: 60px; line-height: 1.1; }
.dpad-arrow { font-size: 1.4rem; }
.dpad-name { font-size: .85rem; }
.dpad-reset { min-height: 60px; padding: 0 6px; font-size: .85rem; }

/* 鸡兔同笼 */
.ct-ctrl { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
.ct-label { width: 100%; text-align: center; font-weight: 800; color: var(--ink-2); }
.ct-cur { min-width: 56px; text-align: center; font-size: 1.8rem; color: var(--theme); font-variant-numeric: tabular-nums; }
.ct-status { margin: 8px 0; padding: 8px 12px; border-radius: 12px; background: var(--sun-bg); font-weight: 700; }
.ct-status.ok { background: var(--ok-bg); color: var(--ok); }
.ct-table td { font-variant-numeric: tabular-nums; }
.ct-table tr.now td { background: var(--theme-light); font-weight: 900; }
.ct-table tr.ok td { background: var(--ok-bg); color: var(--ok); }
.ct-cmp { font-size: .85rem; }
.legs-fig { max-height: 40vh; }
.animal { cursor: pointer; outline: none; }
.animal-hit { fill: transparent; }
.animal:focus-visible .animal-hit { stroke: var(--focus); stroke-width: 2; }
.animal-body { fill: #FFF3D6; stroke: var(--ink); stroke-width: 2; }
.animal-head { fill: #FFF3D6; stroke: var(--ink); stroke-width: 2; }
.animal.rabbit .animal-body, .animal.rabbit .animal-head { fill: #E8E2FF; }
.leg { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.leg.added { stroke: var(--theme); }

/* 错题本 */
.chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; }
.filter-chip { min-height: 40px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; border: 2px solid var(--edge-strong); background: var(--surface); font-weight: 800; font-size: .9rem; }
.filter-chip.on { background: var(--theme); border-color: var(--theme-deep); color: #fff; }
.wrong-list { list-style: none; padding: 0; margin: 14px 0; display: grid; gap: 10px; }
.wrong-item { background: var(--surface); border: 2px solid var(--edge); border-radius: 18px; padding: 12px 14px; }
.wrong-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.wrong-count { font-size: .85rem; }
.wrong-prompt { margin: 8px 0; white-space: pre-line; overflow-wrap: anywhere; }

/* 每日一练 */
.daily-card { text-align: center; }
.daily-card h2 { margin: 4px 0; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-top: 10px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.day-dot { width: 36px; height: 36px; border-radius: 50%; border: 2px dashed var(--edge-strong); display: flex; align-items: center; justify-content: center; font-weight: 900; }
.day.on .day-dot { background: var(--ok); border: 0; color: #fff; }
.day-name { font-size: .8rem; color: var(--ink-2); }

/* 徽章墙 */
.badge-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin: 12px 0; }
.badge { padding: 14px 10px 12px; border-radius: 20px; background: var(--surface); border: 2px solid var(--edge); text-align: center; }
.badge .badge-emoji { font-size: 2.4rem; filter: grayscale(1); opacity: .45; }
.badge.on { border-color: var(--sun); box-shadow: 0 4px 0 var(--sun); }
.badge.on .badge-emoji { filter: none; opacity: 1; }
.badge-name { font-weight: 900; }
.badge-desc { font-size: .82rem; color: var(--ink-2); min-height: 2.6em; }
.badge-date { color: var(--ok); font-weight: 800; font-size: .85rem; }
.badge-bar { height: 8px; border-radius: 4px; background: var(--edge); overflow: hidden; margin-top: 6px; }
.badge-bar span { display: block; height: 100%; background: var(--sun); }
.badge-prog { font-size: .8rem; color: var(--ink-2); margin-top: 2px; }

/* 家长页 */
.plain-head .icon-btn { margin-bottom: 8px; }
.stat-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.stat { text-align: center; padding: 8px; border-radius: 14px; background: var(--surface-2); }
.stat-val { font-size: 1.4rem; font-weight: 900; color: var(--theme); }
.stat-label { font-size: .85rem; color: var(--ink-2); }
.unit-stat { border-bottom: 1px dashed var(--edge); padding: 6px 0; }
.unit-stat summary { display: flex; justify-content: space-between; gap: 8px; min-height: 44px; align-items: center; cursor: pointer; font-weight: 800; flex-wrap: wrap; }
.unit-stat summary .muted { font-size: .85rem; font-weight: 600; }
.unit-stat .mi-table { margin: 6px 0; font-size: .88rem; }
.unit-stat td.low { color: var(--oops); font-weight: 900; }
.top-wrong { padding-left: 1.3em; }
.top-wrong li { margin: 6px 0; overflow-wrap: anywhere; }
.btn-col { display: grid; gap: 10px; margin-top: 10px; }
.btn.danger { color: #C2410C; border-color: #F5B48C; box-shadow: 0 4px 0 #F5B48C; }
.export-text { width: 100%; font: 12px/1.4 ui-monospace, monospace; border-radius: 10px; border: 1px solid var(--edge-strong); background: var(--surface-2); color: var(--ink); padding: 8px; margin-top: 8px; }
.modal-body { white-space: pre-line; }
.speak-btn { margin-left: auto; }
.q-meta .speak-btn + .hint-btn { margin-left: 6px; }

/* 讲解 */
.explain {
  margin-top: 14px; padding: 14px 16px; border-radius: 20px;
  background: var(--surface); border: 2px solid var(--ok); box-shadow: 0 4px 0 var(--ok);
  scroll-margin-top: 80px;
}
.explain-title { font-size: 1.1rem; }
.explain-answer { margin: 8px 0; padding: 8px 12px; background: var(--ok-bg); border-radius: 12px; overflow-wrap: anywhere; }
.explain-answer b { color: var(--ok); }
.explain-steps { margin: 6px 0 0; padding: 0; list-style: none; }
.explain-steps li { margin: 6px 0; padding-left: 10px; border-left: 3px solid var(--ok-bg); overflow-wrap: anywhere; }

/* 反馈卡片（从底部滑出） */
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  max-width: 560px; margin: 0 auto; max-height: 70vh; overflow-y: auto;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0; border: 2px solid var(--edge-strong); border-bottom: 0;
  background: var(--surface); box-shadow: 0 -8px 24px rgba(0, 0, 0, .12);
  animation: slideUp .22s ease;
}
.sheet-ok { background: var(--ok-bg); border-color: var(--ok); }
.sheet-oops { background: var(--oops-bg); border-color: var(--oops); }
.sheet-hint { background: var(--sun-bg); border-color: var(--sun); }
.sheet-title { font-size: 1.2rem; font-weight: 900; }
.sheet-ok .sheet-title { color: var(--ok); }
.sheet-body { margin: 6px 0 2px; }
.sheet-actions { display: flex; gap: 10px; margin-top: 12px; }
.sheet-actions .btn { flex: 1; }
.sheet-actions .btn-ghost { flex: 0 0 auto; }

/* 结算 */
.result { text-align: center; padding: 24px 6px; }
.result-emoji { font-size: 4rem; line-height: 1.1; }
.result-title { font-size: 1.6rem; margin: 6px 0; }
.result-stars { font-size: 3rem; letter-spacing: 6px; margin: 4px 0; }
.result-stars .star.pop { animation: starPop .35s ease; }
.result-score { font-size: 1.1rem; }
.result-score b { font-size: 1.5rem; color: var(--theme); }
.result-best { color: var(--ok); font-weight: 800; }
.result-tip { background: var(--surface); border: 2px solid var(--edge); border-radius: 16px; padding: 12px; text-align: left; }
.result-actions { display: grid; gap: 12px; margin-top: 18px; }

/* 设置 */
.plain-head { padding: 18px 0 4px; }
.plain-head h1 { font-size: 1.6rem; font-weight: 900; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; border-bottom: 1px dashed var(--edge); }
.set-row:last-child { border-bottom: 0; }
.set-label { font-weight: 800; }
.set-desc { font-size: .88rem; color: var(--ink-2); }
.set-link { display: flex; justify-content: space-between; align-items: center; min-height: 52px; font-weight: 800; }
.switch { flex: none; width: 64px; height: 38px; border-radius: 999px; border: 2px solid var(--edge-strong); background: var(--edge); position: relative; padding: 0; }
.switch::before { content: ""; position: absolute; inset: -6px; }
.switch-knob { position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%; background: var(--surface); box-shadow: 0 2px 4px rgba(0, 0, 0, .2); transition: transform .18s; }
.switch.on { background: var(--ok); border-color: var(--ok); }
.switch.on .switch-knob { transform: translateX(26px); }
.about p { font-size: .9rem; }

/* 弹窗、轻提示 */
.modal-mask {
  position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: rgba(20, 16, 40, .45); animation: fadeIn .16s ease;
}
.modal-mask.closing { opacity: 0; transition: opacity .15s; }
.modal {
  width: 100%; max-width: 360px; padding: 22px 18px 18px; border-radius: 24px; text-align: center;
  background: var(--surface); border: 2px solid var(--edge-strong); box-shadow: 0 6px 0 var(--edge-strong);
  animation: pop .22s ease;
}
.modal-emoji { font-size: 2.6rem; }
.modal-title { font-size: 1.25rem; margin: 4px 0; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions .btn { flex: 1; padding: 0 10px; }
.toast {
  position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top)); z-index: 70;
  transform: translate(-50%, -150%); max-width: calc(100% - 32px);
  padding: 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 700;
  transition: transform .2s ease; pointer-events: none; text-align: center;
}
.toast.show { transform: translate(-50%, 0); }

/* 撒星星 */
.burst { position: fixed; inset: 0; pointer-events: none; z-index: 80; }
.burst span { position: absolute; font-size: 1.3rem; animation: burst .6s ease-out forwards; }

/* ---------------- 动画（都 ≤ 300ms，尊重“减少动态效果”） ---------------- */
@keyframes pop { 0% { transform: scale(.94); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
@keyframes starPop { 0% { transform: scale(.3); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes burst { 0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1); opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; }
  .blank.active::after { animation: none !important; }
}

/* 宽屏（平板、电脑）稍微舒展一点 */
@media (min-width: 600px) {
  .map { margin: 8px 0 0; border-radius: 28px; }
  .isle-blob { width: 92px; height: 76px; }
}

/* 数学岛 · 基础工具：命名空间、可复现随机数、小工具函数
 * 本文件不碰 DOM，Node 测试里也能直接 require。 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};

  // ---------- 可复现随机数（mulberry32） ----------
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hashStr(s) {
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function makeRng(seed) {
    var next = mulberry32(seed >>> 0);
    var r = {
      seed: seed,
      next: next,
      /** [min, max] 闭区间整数 */
      int: function (min, max) { return min + Math.floor(next() * (max - min + 1)); },
      pick: function (arr) { return arr[Math.floor(next() * arr.length)]; },
      chance: function (p) { return next() < p; },
      shuffle: function (arr) {
        var a = arr.slice();
        for (var i = a.length - 1; i > 0; i--) {
          var j = Math.floor(next() * (i + 1));
          var t = a[i]; a[i] = a[j]; a[j] = t;
        }
        return a;
      },
      sample: function (arr, k) { return r.shuffle(arr).slice(0, k); }
    };

    range: function (a, b) { var out = []; for (var i = a; i <= b; i++) out.push(i); return out; },
    uniq: function (arr) {

      arr.forEach(function (x) { var k = typeof x + ':' + String(x); if (!seen[k]) { seen[k] = 1; out.push(x); } });

    pad2: function (n) { return (n < 10 ? '0' : '') + n; },
    todayKey: function (d) {
      d = d || new Date();

    },
    /** 第一步、第二步……（讲解用） */
    stepName: function (i) {
      var cn = ['一', '二', '三', '四', '五', '六', '七', '八', '九', '十'];

    escapeHtml: function (s) {

  MI.newSeed = newSeed;
  MI.hashStr = hashStr;

  <script>/* js/core/numbers.js */
/* 数学岛 · 大数工具：读法、分级、近似数等（纯函数，可在 Node 中测试） */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};

  var DIGITS = '零一二三四五六七八九';
  var POS_UNITS = ['', '十', '百', '千'];
  var LEVEL_NAMES = ['', '万', '亿'];
  var LEVEL_LABELS = ['个级', '万级', '亿级'];
  /** 数位（从右往左第 p 位，p 从 0 开始） */
  var PLACE_NAMES = ['个位', '十位', '百位', '千位', '万位', '十万位', '百万位', '千万位', '亿位', '十亿位', '百亿位', '千亿位'];
  /** 计数单位 */
  var COUNT_UNITS = ['一', '十', '百', '千', '万', '十万', '百万', '千万', '亿', '十亿', '百亿', '千亿'];
  /** 计数单位的完整说法（“10 个一万是十万”“10 个十万是一百万”） */
  var UNIT_FULL = ['一', '十', '一百', '一千', '一万', '十万', '一百万', '一千万', '一亿', '十亿', '一百亿', '一千亿'];

  var MAX = 1e12;

  function assertRange(n) {
    if (typeof n !== 'number' || !isFinite(n) || Math.floor(n) !== n || n < 0 || n >= MAX) {
      throw new Error('数字超出范围（0 ≤ n < 1 万亿的整数）：' + n);
    }
  }

  function pow10(p) { return Math.pow(10, p); }

  /** 从右往左第 p 位上的数字 */
  function digitAt(n, p) { return Math.floor(n / pow10(p)) % 10; }

  /**
   * 按级读数，返回每一级的读法片段（从高级到低级）。
   * 规则：每级末尾的 0 不读；其他数位上一个 0 或连续几个 0 只读一个“零”；
   * 整级都是 0 时这一级不读（也不读“万”），这些 0 和后面的 0 一起只读一个“零”。
   */
  function readingSegments(n) {
    assertRange(n);
    if (n === 0) return [{ level: 0, digits: '0', text: '零' }];
    var len = String(n).length;
    var top = Math.floor((len - 1) / 4);
    var out = '';
    var pending = false; // 有待读的“零”
    var segs = [];
    for (var lv = top; lv >= 0; lv--) {
      var segText = '';
      var lvVal = Math.floor(n / Math.pow(10000, lv)) % 10000;
      var hiPos = lv === top ? (len - 1) % 4 : 3;
      for (var pos = hiPos; pos >= 0; pos--) {
        var d = digitAt(n, lv * 4 + pos);
        if (d === 0) {
          if (out.length) pending = true;
          continue;
        }
        var piece = '';
        if (pending) { piece += '零'; pending = false; }
        // 最高位是十位上的 1：读“十”而不是“一十”（如 15 → 十五，120000 → 十二万）
        var name = (d === 1 && pos === 1 && out.length === 0) ? '' : DIGITS[d];
        piece += name + POS_UNITS[pos];
        out += piece; segText += piece;
      }
      if (lv > 0 && lvVal > 0) {
        out += LEVEL_NAMES[lv]; segText += LEVEL_NAMES[lv];
        pending = false; // 这一级末尾的 0 不读
      }
      var s = String(lvVal);
      if (lv !== top) s = ('0000' + s).slice(-4);
      segs.push({ level: lv, digits: s, text: segText });
    }
    return segs;
  }

  /** 数字转中文读法（0 ≤ n < 1 万亿） */
  function toChineseReading(n) {
    return readingSegments(n).map(function (s) { return s.text; }).join('');
  }

  var CN_DIGIT = { '零': 0, '〇': 0, '一': 1, '二': 2, '两': 2, '三': 3, '四': 4, '五': 5, '六': 6, '七': 7, '八': 8, '九': 9 };
  var CN_POS = { '十': 10, '百': 100, '千': 1000 };

  function parseSection(str) {
    var total = 0, cur = -1;
    for (var i = 0; i < str.length; i++) {
      var ch = str[i];
      if (ch in CN_DIGIT) { cur = CN_DIGIT[ch]; }
      else if (ch in CN_POS) { total += (cur < 0 ? 1 : cur) * CN_POS[ch]; cur = -1; }
      else return NaN;
    }
    if (cur > 0) total += cur;
    return total;
  }

  /** 中文读法转数字（用于测试和宽容判定）；无法识别返回 NaN */
  function parseChineseReading(s) {
    s = String(s || '').replace(/\s+/g, '');
    if (!s) return NaN;
    var total = 0;
    var yi = s.lastIndexOf('亿');
    if (yi >= 0) {
      var hi = parseChineseReading(s.slice(0, yi));
      if (!(hi > 0)) return NaN;
      total += hi * 1e8; s = s.slice(yi + 1);
    }
    var wan = s.indexOf('万');
    if (wan >= 0) {
      var w = parseSection(s.slice(0, wan));
      if (!(w > 0)) return NaN;
      total += w * 1e4; s = s.slice(wan + 1);
    }
    if (s) {
      var rest = parseSection(s);
      if (isNaN(rest)) return NaN;
      total += rest;
    }
    return total;
  }

  /** 分级显示：302000500 → "3｜0200｜0500" */
  function splitLevelsText(n, sep) {
    var s = String(n);
    sep = sep || '｜';
    var parts = [];
    while (s.length > 4) { parts.unshift(s.slice(-4)); s = s.slice(0, -4); }
    parts.unshift(s);
    return parts.join(sep);
  }

  /** 四舍五入求近似数：返回以“万”或“亿”为单位的数值。approx(485600, '万') → 49 */
  function approx(n, unit) {
    assertRange(n);
    var u = unit === '亿' ? 1e8 : 1e4;
    return Math.floor((n + u / 2) / u);
  }

  function approxText(n, unit) { return approx(n, unit) + (unit === '亿' ? '亿' : '万'); }

  /** 求近似数时要“看”的那一位（数位下标）：万 → 千位(3)，亿 → 千万位(7) */
  function lookPlace(unit) { return unit === '亿' ? 7 : 3; }

  function unitValue(unit) { return unit === '亿' ? 1e8 : 1e4; }

  /** 读数时读出几个“零” */
  function zeroCount(n) {
    var m = toChineseReading(n).match(/零/g);
    return n === 0 ? 0 : (m ? m.length : 0);
  }

  /** 数位所在的级：0 个级，1 万级，2 亿级 */
  function levelOfPlace(p) { return Math.floor(p / 4); }

  MI.num = {
    DIGITS: DIGITS,
    POS_UNITS: POS_UNITS,
    LEVEL_NAMES: LEVEL_NAMES,
    LEVEL_LABELS: LEVEL_LABELS,
    PLACE_NAMES: PLACE_NAMES,
    COUNT_UNITS: COUNT_UNITS,
    UNIT_FULL: UNIT_FULL,
    digitAt: digitAt,
    pow10: pow10,
    readingSegments: readingSegments,
    toChineseReading: toChineseReading,
    parseChineseReading: parseChineseReading,
    splitLevelsText: splitLevelsText,
    approx: approx,
    approxText: approxText,
    lookPlace: lookPlace,
    unitValue: unitValue,
    zeroCount: zeroCount,
    levelOfPlace: levelOfPlace
  };
  // 需求里点名的两个函数，同时挂在顶层方便调用
  MI.toChineseReading = toChineseReading;
  MI.approx = approx;
})(typeof window !== 'undefined' ? window : globalThis);

/* 数学岛 · 答案判定（宽容：全角/半角、空格、千分位逗号、汉字读法规范化、角度容差） */
(function (root) {

 *   value()      当前作答；没答完返回 null；返回 {wrong:'提示'} 表示明显错误
 *   onWrong(v)   答错后调整界面（比如把选错的选项变灰）
 *   reveal()     显示正确答案
 *   lock()       答题结束，禁止再操作
 *   destroy()    清理
 * ctx: { submit(), changed(), incomplete: '没答完时的提示' } */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  MI.types = MI.types || {};
  var h = function () { return MI.ui.h.apply(null, arguments); };

  // ---------------- 选择题 ----------------
  MI.types.choice = function (box, q, ctx) {
    var opts = q.data.options;
    var big = q.data.big || opts.every(function (o) { return String(o).length <= 2; });
    var wide = !big && opts.some(function (o) { return String(o).length > 9; });
    var list = h('div', { class: 'choices' + (big ? ' choices-big' : '') + (wide ? ' choices-wide' : ''), role: 'radiogroup' });
    var selected = null, locked = false;
    var btns = opts.map(function (o, i) {
      var b = h('button', {
        type: 'button', class: 'choice', role: 'radio', 'aria-checked': 'false',
        onclick: function () {
          if (locked || b.disabled) return;
          MI.sound.play('tap');
          selected = o;
          btns.forEach(function (x) { x.classList.remove('sel'); x.setAttribute('aria-checked', 'false'); });
          b.classList.add('sel'); b.setAttribute('aria-checked', 'true');
          ctx.changed();
        }
      }, [big ? null : h('span', { class: 'choice-tag', text: 'ABCDEF'[i] }), h('span', { class: 'choice-text', text: String(o) })]);
      list.appendChild(b);
      return b;
    });
    box.appendChild(list);
    return {
      value: function () { return selected; },
      onWrong: function (v) {
        btns.forEach(function (b, i) { if (opts[i] === v) { b.classList.remove('sel'); b.classList.add('tried'); b.disabled = true; } });
        selected = null;
      },
      reveal: function () { btns.forEach(function (b, i) { if (opts[i] === q.answer) b.classList.add('correct'); }); },
      lock: function () { locked = true; btns.forEach(function (b) { b.disabled = true; }); },
      destroy: function () {}
    };
  };

  // ---------------- 判断题 ----------------
  MI.types.judge = function (box, q, ctx) {
    var list = h('div', { class: 'choices choices-judge', role: 'radiogroup' });
    var selected = null, locked = false;
    var btns = [true, false].map(function (v) {
      var b = h('button', {
        type: 'button', class: 'choice judge-' + (v ? 'yes' : 'no'), role: 'radio', 'aria-checked': 'false',
        onclick: function () {
          if (locked || b.disabled) return;
          MI.sound.play('tap');
          selected = v;
          btns.forEach(function (x) { x.classList.remove('sel'); x.setAttribute('aria-checked', 'false'); });
          b.classList.add('sel'); b.setAttribute('aria-checked', 'true');
          ctx.changed();
        }
      }, [h('span', { class: 'judge-mark', text: v ? '✔' : '✘' }), h('span', { text: v ? '对' : '错' })]);
      list.appendChild(b);
      return b;
    });
    box.appendChild(list);
    return {
      value: function () { return selected; },
      onWrong: function (v) { btns.forEach(function (b, i) { if ([true, false][i] === v) { b.classList.remove('sel'); b.classList.add('tried'); } }); selected = null; },
      reveal: function () { btns[q.answer ? 0 : 1].classList.add('correct'); },
      lock: function () { locked = true; btns.forEach(function (b) { b.disabled = true; }); },
      destroy: function () {}
    };
  };

  // ---------------- 多选（□ 里能填几） ----------------
  MI.types.multi = function (box, q, ctx) {
    var opts = q.data.options;
    var sel = {}, locked = false;
    var grid = h('div', { class: 'multi-grid' });
    var btns = opts.map(function (o) {
      var b = h('button', {
        type: 'button', class: 'multi-btn', 'aria-pressed': 'false', text: String(o),
        onclick: function () {
          if (locked) return;
          MI.sound.play('tap');
          sel[o] = !sel[o];
          b.classList.toggle('sel', !!sel[o]);
          b.setAttribute('aria-pressed', sel[o] ? 'true' : 'false');
          ctx.changed();
        }
      });
      grid.appendChild(b);
      return b;
    });
    box.appendChild(h('p', { class: 'widget-tip', text: '可以选好几个，选好了点“确定”。' }));
    box.appendChild(grid);
    return {
      value: function () {
        var v = opts.filter(function (o) { return sel[o]; });
        return v.length ? v : null;
      },
      onWrong: function () {},
      reveal: function () {
        btns.forEach(function (b, i) {
          var inAns = q.answer.indexOf(opts[i]) >= 0;
          b.classList.toggle('correct', inAns);
          b.classList.toggle('miss', !inAns && !!sel[opts[i]]);
        });
      },
      lock: function () { locked = true; btns.forEach(function (b) { b.disabled = true; }); },
      destroy: function () {}
    };
  };

  // ---------------- 填空（自带数字小键盘） ----------------
  /** 模板里的 [] 表示一个空，\n 换行 */
  MI.types.fill = function (box, q, ctx, opt) {
    opt = opt || {};
    var tpl = q.data.template || '[]';
    var parts = tpl.split('[]');
    var line = h('div', { class: 'fill-line' + (parts.length === 2 && !parts[0].trim() && !parts[1].trim() ? ' fill-solo' : '') });
    var values = [], blanks = [], active = 0, locked = false;
    parts.forEach(function (txt, i) {
      txt.split('\n').forEach(function (seg, j) {
        if (j > 0) line.appendChild(h('span', { class: 'fill-br' }));
        if (seg) line.appendChild(h('span', { class: 'fill-text', text: seg }));
      });
      if (i < parts.length - 1) {
        var idx = blanks.length;
        var b = h('button', {
          type: 'button', class: 'blank', 'aria-label': '第 ' + (idx + 1) + ' 个空',
          onclick: function () { if (!locked) { focus(idx); } }
        });
        values.push('');
        blanks.push(b);
        line.appendChild(b);
      }
    });
    box.appendChild(line);

    function render() {
      blanks.forEach(function (b, i) {
        b.textContent = values[i] || '';
        b.classList.toggle('active', i === active && !locked);
        b.classList.toggle('empty', !values[i]);
      });
    }
    function focus(i) {
      active = i; render();
      try { blanks[i].scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (e) { /* 旧浏览器 */ }
    }
    function onKey(k) {
      if (locked) return;
      var v = values[active];
      blanks[active].classList.remove('wrong');
      if (k === '⌫') values[active] = v.slice(0, -1);
      else if (k === 'clear') values[active] = '';
      else if (k === 'ok') {
        var empty = values.indexOf('');
        if (empty < 0) { ctx.submit(); return; }
        if (values[active] && empty !== active) { focus(empty); return; }
        MI.ui.toast(blanks.length > 1 ? '还有空没填哦' : '先填上答案哦');
        focus(empty);
        return;
      } else if (v.length < 14) values[active] = v + k;
      render();
      ctx.changed();
    }
    var extras = q.data.keys || [];
    MI.keypad.open({ extras: extras, onKey: onKey });
    render();
    // 空格被键盘挡住时，往上滚一点，让它刚好露在键盘上面
    setTimeout(function () {
      var kp = document.getElementById('keypad');
      if (!kp || !blanks[0] || !blanks[0].isConnected) return;
      var over = blanks[active].getBoundingClientRect().bottom - kp.getBoundingClientRect().top + 16;
      if (over > 0) { try { root.scrollBy(0, over); } catch (e) { /* 忽略 */ } }
    }, 50);

    return {
      value: function () {
        if (values.some(function (v) { return !v; })) return null;
        return blanks.length === 1 ? values[0] : values.slice();
      },
      onWrong: function () {
        var ans = Array.isArray(q.answer) ? q.answer : [q.answer];
        blanks.forEach(function (b, i) {
          var o = { tolerance: q.data.tolerance, prefix: q.data.prefix, suffix: q.data.suffix };
          if (!MI.blankEqual(values[i], ans[i], o)) b.classList.add('wrong');
        });
        var firstWrong = blanks.findIndex ? blanks.findIndex(function (b) { return b.classList.contains('wrong'); }) : 0;
        focus(firstWrong >= 0 ? firstWrong : 0);
      },
      reveal: function () {
        var ans = Array.isArray(q.answer) ? q.answer : [q.answer];
        blanks.forEach(function (b, i) { values[i] = String(ans[i]); b.classList.remove('wrong'); b.classList.add('revealed'); });
        locked = true; render();
      },
      lock: function () { locked = true; render(); MI.keypad.close(); },
      destroy: function () { MI.keypad.close(); },
      usesKeypad: true
    };
  };

  // ---------------- 点选拼读 ----------------
  MI.types.reading = function (box, q, ctx) {
    var tiles = q.data.tiles;
    var picked = [], locked = false;
    var lineBox = h('div', { class: 'read-line', 'aria-live': 'polite' });
    var pool = h('div', { class: 'tile-pool' });
    var btns = tiles.map(function (t, i) {
      var b = h('button', {
        type: 'button', class: 'tile', text: t,
        onclick: function () {
          if (locked || b.disabled) return;
          MI.sound.play('tap');
          picked.push(i); b.disabled = true; b.classList.add('used');
          render(); ctx.changed();
        }
      });
      pool.appendChild(b);
      return b;
    });
    var tools = h('div', { class: 'read-tools' }, [
      h('button', { type: 'button', class: 'btn btn-small', text: '↩ 撤销', onclick: function () { if (locked || !picked.length) return; var i = picked.pop(); btns[i].disabled = false; btns[i].classList.remove('used'); render(); ctx.changed(); } }),
      h('button', { type: 'button', class: 'btn btn-small', text: '清空', onclick: function () { if (locked) return; picked.forEach(function (i) { btns[i].disabled = false; btns[i].classList.remove('used'); }); picked = []; render(); ctx.changed(); } })
    ]);
    function render() {
      lineBox.innerHTML = '';
      lineBox.classList.remove('wrong');
      if (!picked.length) lineBox.appendChild(h('span', { class: 'read-ph', text: '点下面的字块，读法会出现在这里' }));
      picked.forEach(function (i) {
        lineBox.appendChild(h('span', { class: 'read-chip', text: tiles[i] }));
      });
    }
    box.appendChild(lineBox);
    box.appendChild(tools);
    box.appendChild(pool);
    render();
    return {
      value: function () { return picked.length ? picked.map(function (i) { return tiles[i]; }).join('') : null; },
      onWrong: function () { lineBox.classList.add('wrong'); },
      reveal: function () {
        lineBox.innerHTML = '';
        lineBox.appendChild(h('span', { class: 'read-answer', text: q.answer }));
        lineBox.classList.add('revealed');
      },
      lock: function () { locked = true; btns.forEach(function (b) { b.disabled = true; }); },
      destroy: function () {}
    };
  };
})(typeof window !== 'undefined' ? window : globalThis);

  <script>/* js/core/engine.js */
/* 数学岛 · 做题引擎：出题 → 作答 → 反馈 → 下一题
 * 反馈规则：答对给小动画和音效；第一次答错给一句提示，可以再试；
 * 第二次答错显示完整分步讲解，练习模式下再补一道同类题巩固。不扣分、不满屏红叉。 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};

  var MODE_NAME = { practice: '练一练', quiz: '闯关测验', review: '重练错题', daily: '每日一练' };

  function formatAnswer(q) {
    if (q.answerText) return q.answerText;
    var a = q.answer;
    if (q.type === 'judge') return a ? '✔ 对' : '✘ 错';
    if (q.type === 'multi') return a.join('、');
    // 填空题：把答案填回模板里，读起来就是一句完整的话
    var tpl = q.data && q.data.template;
    if (tpl && tpl !== '[]') {
      var arr = Array.isArray(a) ? a : [a], i = 0;
      return tpl.replace(/\[\]/g, function () { return arr[i++]; }).replace(/\n/g, '，');
    }
    return Array.isArray(a) ? a.join('，') : String(a);
  }

  /**
   * opts: {
   *   mode, title, items:[{unit,gen,seed,d}], theme:'#hex',
   *   exitHref, again: () => 新的 items（再来一轮）, onFinish(result)
   * }
   */
  function run(app, opts) {
    var h = MI.ui.h;
    var items = opts.items.slice();
    var idx = 0, q = null, ctrl = null, attempts = 0, streak = 0, finished = false;
    var results = [];
    var consolidate = opts.mode === 'practice' || opts.mode === 'daily';

    var page = h('div', { class: 'page play' });
    if (opts.theme) { page.style.setProperty('--theme', opts.theme); page.style.setProperty('--theme-deep', MI.util.shade(opts.theme, -0.25)); page.style.setProperty('--tl-l', MI.util.shade(opts.theme, 0.85)); page.style.setProperty('--tl-d', MI.util.shade(opts.theme, -0.68)); }
    if (opts.theme) { document.body.style.setProperty('--theme', opts.theme); document.body.style.setProperty('--theme-deep', MI.util.shade(opts.theme, -0.25)); }
    var bar = h('div', { class: 'progress-fill' });
    var counter = h('span', { class: 'play-count' });
    var streakEl = h('span', { class: 'streak', 'aria-live': 'polite' });
    var top = h('header', { class: 'play-top' }, [
      h('button', { type: 'button', class: 'icon-btn', 'aria-label': '离开', text: '✕', onclick: function () { MI.router.go(opts.exitHref); } }),
      h('div', { class: 'progress', role: 'progressbar' }, bar),
      counter,
      streakEl
    ]);
    var main = h('main', { class: 'play-main' });
    var submitBtn = h('button', { type: 'button', class: 'btn btn-primary btn-block', text: '确定', onclick: submit });
    var foot = h('footer', { class: 'play-foot' }, submitBtn);
    var sheet = h('div', { class: 'sheet', role: 'status', 'aria-live': 'polite', hidden: true });
    page.appendChild(top); page.appendChild(main); page.appendChild(foot); page.appendChild(sheet);
    app.appendChild(page);

    MI.router.setGuard(function (proceed) {
      if (finished || !results.length) { proceed(); return; }
      MI.ui.modal({
        emoji: '🤔', title: '这一轮还没做完', body: '现在离开的话，这一轮的成绩不会保存哦。',
        buttons: [{ text: '先离开', onClick: proceed }, { text: '继续做题', primary: true }]
      });
    });

    function updateTop() {
      var total = items.length;
      bar.style.width = Math.round(idx / total * 100) + '%';
      counter.textContent = Math.min(idx + 1, total) + '/' + total;
      streakEl.textContent = streak >= 2 ? '🔥' + streak : '';
    }

    function show() {
      if (ctrl) { ctrl.destroy(); ctrl = null; }
      MI.keypad.close();
      hideSheet();
      var ref = items[idx];
      q = MI.makeQuestion(ref);
      attempts = 0;
      main.innerHTML = '';
      var meta = h('div', { class: 'q-meta' }, [
        ref.extra ? h('span', { class: 'chip chip-sun', text: '巩固一下' }) : null,
        h('span', { class: 'chip', text: MI.skillName(q.unit, q.skill) }),
        h('span', { class: 'chip chip-soft', text: MI.DIFFICULTY[q.difficulty] }),
        MI.speech && MI.speech.enabled() ? h('button', { type: 'button', class: 'hint-btn speak-btn', 'aria-label': '读题', text: '🔊', onclick: function () { MI.speech.read(q); } }) : null,
        h('button', { type: 'button', class: 'hint-btn', text: '💡 提示', onclick: showHint })
      ]);
      var card = h('section', { class: 'q-card' }, [meta, h('p', { class: 'q-prompt', text: q.prompt })]);
      if (q.data.show) card.appendChild(h('div', { class: 'bignum' + (String(q.data.show).length > 14 ? ' long' : ''), text: q.data.show }));
      if (q.data.diagram && MI.diagrams) card.appendChild(MI.diagrams.render(q.data.diagram));
      if (q.data.figure && MI.geo) card.appendChild(MI.geo.figure(q.data.figure));
      if (q.data.table && MI.diagrams) card.appendChild(MI.diagrams.table(q.data.table));
      var wbox = h('div', { class: 'q-widget' });
      card.appendChild(wbox);
      main.appendChild(card);
      var mount = MI.types[q.type];
      ctrl = mount(wbox, q, { submit: submit, changed: function () {} });
      foot.hidden = !!ctrl.usesKeypad;
      submitBtn.disabled = false;
      updateTop();
      try { root.scrollTo(0, 0); } catch (e) { /* 忽略 */ }
      if (MI.speech && MI.speech.auto) MI.speech.auto(q);
    }

    function submit() {
      if (!ctrl || sheet.dataset.kind === 'ok' || sheet.dataset.kind === 'learn') return;
      var v = ctrl.value();
      if (v == null) { MI.ui.toast(ctrl.incomplete ? ctrl.incomplete() : '先完成作答哦'); return; }
      if (typeof v === 'object' && v.wrong) { wrong(v.wrong, v); return; }
      if (MI.check(q, v)) right(); else wrong(null, v);
    }

    function record(firstTry) {
      results.push({ id: q.id, unit: q.unit, skill: q.skill, firstTry: firstTry, extra: !!items[idx].extra });
      MI.progress.recordAnswer(q, firstTry);
      if (!firstTry) MI.progress.addWrong(q);
      if (opts.onAnswer) opts.onAnswer(q, firstTry);
    }

    function right() {
      attempts++;
      if (attempts === 1) { record(true); streak++; MI.progress.recordStreak(streak); }
      ctrl.lock();
      MI.sound.play('correct');
      MI.ui.celebrate(main.querySelector('.q-card'), 8);
      var card = main.querySelector('.q-card');
      if (card) { card.classList.remove('pop'); void card.offsetWidth; card.classList.add('pop'); }
      var msg = attempts === 1 ? MI.ui.praise(streak) : '改对啦！知错就改，真棒！';
      var extra = null;
      // 错题本里的题（不管在哪种模式下遇到），一次答对就记一次；连续答对 2 次自动移出
      if (attempts === 1 && MI.progress.inWrongBook(q.id) && !items[idx].fresh) {
        extra = MI.progress.wrongRight(q) ? '这道题已经从错题本“毕业”啦 🎓' : '再答对一次，它就能从错题本毕业啦！';
      }
      showSheet('ok', '✨ ' + msg, extra, [{ text: idx + 1 < items.length ? '下一题 →' : '看看成绩 →', primary: true, onClick: next }]);
      updateTop();
    }

    function wrong(hintOverride, v) {
      attempts++;
      if (attempts === 1) { record(false); streak = 0; }
      if (ctrl.onWrong && !(v && v.wrong)) ctrl.onWrong(v);
      MI.sound.play('wrong');
      updateTop();
      if (attempts === 1) {
        var hint = hintOverride || (ctrl.hintFor && ctrl.hintFor(v)) || q.hint;
        showSheet('oops', '🤔 ' + MI.ui.oops(), hint, [
          { text: '看讲解', onClick: learn },
          { text: '再试一次', primary: true, onClick: hideSheet }
        ]);
      } else {
        learn();
      }
    }

    /** 显示完整讲解 */
    function learn() {
      ctrl.reveal();
      ctrl.lock();
      MI.keypad.close();
      foot.hidden = true;
      var ex = h('section', { class: 'explain' }, [
        h('h3', { class: 'explain-title', text: '🧑‍🏫 一起看看' }),
        h('p', { class: 'explain-answer' }, ['正确答案：', h('b', { text: formatAnswer(q) })]),
        h('ol', { class: 'explain-steps' }, q.explanation.map(function (s) { return h('li', { text: s }); }))
      ]);
      main.appendChild(ex);
      var willAdd = consolidate && !items[idx].extra;
      if (willAdd) {
        var ref = items[idx];
        items.splice(idx + 1, 0, { unit: ref.unit, gen: ref.gen, seed: MI.newSeed(), d: ref.d, extra: true });
      }
      showSheet('learn', '没关系，看懂了就是学会了 👇', willAdd ? '看完讲解，再来一道同类题试试。' : null, [
        { text: '我明白了，继续 →', primary: true, onClick: next }
      ]);
      updateTop();
      setTimeout(function () { try { ex.scrollIntoView({ behavior: MI.ui.reducedMotion() ? 'auto' : 'smooth', block: 'start' }); } catch (e) { /* 忽略 */ } }, 60);
    }

    function showHint() {
      if (sheet.dataset.kind === 'ok' || sheet.dataset.kind === 'learn') return;
      showSheet('hint', '💡 提示', q.hint, [{ text: '知道了', primary: true, onClick: hideSheet }]);
    }

    function showSheet(kind, title, body, buttons) {
      sheet.innerHTML = '';
      sheet.dataset.kind = kind;
      sheet.className = 'sheet sheet-' + kind;
      sheet.appendChild(h('div', { class: 'sheet-title', text: title }));
      if (body) sheet.appendChild(h('p', { class: 'sheet-body', text: body }));
      var row = h('div', { class: 'sheet-actions' });
      buttons.forEach(function (b) {
        row.appendChild(h('button', { type: 'button', class: 'btn ' + (b.primary ? 'btn-primary' : 'btn-ghost'), text: b.text, onclick: b.onClick }));
      });
      sheet.appendChild(row);
      sheet.hidden = false;
      page.classList.add('sheet-open');
      var p = row.querySelector('.btn-primary');
      if (p) setTimeout(function () { try { p.focus({ preventScroll: true }); } catch (e) { /* 忽略 */ } }, 50);
    }
    function hideSheet() {
      sheet.hidden = true;
      sheet.dataset.kind = '';
      page.classList.remove('sheet-open');
    }

    function next() {
      idx++;
      if (idx >= items.length) finish(); else show();
    }

    function finish() {
      finished = true;
      if (ctrl) { ctrl.destroy(); ctrl = null; }
      MI.keypad.close();
      hideSheet();
      MI.router.setGuard(null);
      var mainR = results.filter(function (r) { return !r.extra; });
      var correct = mainR.filter(function (r) { return r.firstTry; }).length;
      var total = mainR.length;
      var stars = 0, best = false;
      if (opts.mode === 'quiz') { stars = MI.starsFor(correct, total); best = MI.progress.recordQuiz(opts.unit, correct, total, stars); }
      else if (opts.mode === 'practice') MI.progress.recordPractice(opts.unit);
      else if (opts.mode === 'daily') { MI.store.set('dailyDone', { date: MI.util.todayKey(), correct: correct, total: total }); MI.store.set('dailyCount', (MI.store.get('dailyCount', 0) || 0) + 1); }
      var weak = {};
      results.forEach(function (r) { if (!r.firstTry) weak[r.unit + '.' + r.skill] = MI.skillName(r.unit, r.skill); });

/* 数学岛 · 路由：用 #/ 哈希，本地直接打开 index.html 也能用 */
(function (root) {
  'use strict';
  var MI = root.MathIsland = root.MathIsland || {};
  var routes = [];
  var current = null, cleanup = null, guard = null, suppress = false;

  function add(pattern, handler) { routes.push({ re: pattern, fn: handler }); }

  function render(hash) {
    var path = hash.replace(/^#/, '') || '/';
    var app = document.getElementById('app');
    if (cleanup) { try { cleanup(); } catch (e) { /* 忽略 */ } cleanup = null; }
    MI.keypad.close();
    guard = null;
    app.innerHTML = '';
    for (var i = 0; i < routes.length; i++) {
      var m = path.match(routes[i].re);
      if (m) {
        var res = routes[i].fn(app, m.slice(1).map(function (x) { return x == null ? undefined : decodeURIComponent(x); }));
        cleanup = typeof res === 'function' ? res : null;
        try { root.scrollTo(0, 0); } catch (e) { /* 忽略 */ }
        var heading = app.querySelector('h1, h2');
        if (heading && heading.textContent) document.title = heading.textContent.trim() + ' · 数学岛';
        return;
      }
    }
    go('#/');
  }

  function onHash() {
    if (suppress) { suppress = false; return; }
    var target = location.hash || '#/';
    if (guard && target !== current) {
      var g = guard;
      suppress = true;
      location.hash = current;
      g(function () { guard = null; location.hash = target; });
      return;
    }
    current = target;
    render(target);
  }

  // “内存路由”：嵌在别的页面里（比如 claude.ai 的预览框）时，不改地址栏的 #，只在页面内部切换
  var memory = !!root.MathIslandMemoryRouter;

  function go(hash) {
    if (memory) {
      if (guard && hash !== current) { var g = guard; g(function () { guard = null; current = hash; render(hash); }); return; }
      current = hash; render(hash); return;
    }
    if (location.hash === hash) { onHash(); return; }
    location.hash = hash;
  }

  MI.router = {
    add: add,
    go: go,
    /** 重新渲染当前页（“再来一轮”） */
    reload: function () { guard = null; render(memory ? current : (location.hash || '#/')); },
    setGuard: function (fn) { guard = fn; },
    start: function () {
      if (memory) {
        // 拦截页面里所有 href="#/..." 的链接
        document.addEventListener('click', function (e) {
          var a = e.target.closest ? e.target.closest('a[href^="#/"]') : null;
          if (!a) return;
          e.preventDefault();
          go(a.getAttribute('href'));
        });
        current = '#/';
        render(current);
        return;
      }
      root.addEventListener('hashchange', onHash);
      onHash();
    },
    current: function () { return current; }
  };
